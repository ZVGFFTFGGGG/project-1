name: download
run-name: dl-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Unique download id (used for run-name + artifact name)'
        required: true
        type: string
      url:
        description: 'Video / page URL (in list mode, any one of them — the real list is in `urls`)'
        required: true
        type: string
      quality:
        description: 'best | 1080 | 720 | 480 | audio'
        required: false
        default: 'best'
        type: string
      mode:
        description: 'video (single item) | collection (whole channel/playlist, zipped) | list (several explicit URLs, batched + zipped)'
        required: false
        default: 'video'
        type: string
      urls:
        description: 'list mode only: JSON array of URLs to download together, batched across jobs and zipped'
        required: false
        default: ''
        type: string
      cookies_enc:
        description: 'AES-256-GCM encrypted cookies.txt, base64 (iv|ct|tag). Leave empty for none.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: dl-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------- single video/audio
  resolve-video:
    if: inputs.mode != 'collection' && inputs.mode != 'list'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate request id
        run: |
          case "${{ inputs.request_id }}" in
            *[!a-zA-Z0-9-]*|"") echo "::error::request_id must be [a-zA-Z0-9-] only"; exit 1;;
          esac

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp + ffmpeg
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade yt-dlp cryptography imageio-ffmpeg curl_cffi
          if command -v zip >/dev/null 2>&1; then
            :
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq zip
          fi
          if command -v ffmpeg >/dev/null 2>&1; then
            FFMPEG_BIN=$(command -v ffmpeg)
          else
            FFMPEG_BIN=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
            chmod +x "$FFMPEG_BIN"
          fi
          echo "FFMPEG_BIN=$FFMPEG_BIN" >> "$GITHUB_ENV"

      - name: Decrypt cookies
        if: ${{ inputs.cookies_enc != '' }}
        env:
          COOKIES_ENC: ${{ inputs.cookies_enc }}
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
        run: |
          if [ -z "$COOKIE_KEY" ]; then
            echo "::error::repository secret COOKIE_KEY is missing"
            exit 1
          fi
          python - <<'PY'
          import base64, os, sys
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          blob = base64.b64decode(os.environ["COOKIES_ENC"])
          key = bytes.fromhex(os.environ["COOKIE_KEY"].strip())
          iv, ct = blob[:12], blob[12:]
          try:
              data = AESGCM(key).decrypt(iv, ct, None)
          except Exception:
              print("::error::cookie decryption failed")
              sys.exit(1)
          with open("cookies.txt", "wb") as f:
              f.write(data)
          PY

      - name: Download
        env:
          TARGET_URL: ${{ inputs.url }}
          QUALITY: ${{ inputs.quality }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          mkdir -p out
          case "$QUALITY" in
            audio) FMT_ARGS="-f bestaudio/best -x --audio-format mp3 --audio-quality 0" ;;
            1080)  FMT_ARGS="-f bv*[height<=1080]+ba/b[height<=1080]/bv*+ba/b --merge-output-format mp4" ;;
            720)   FMT_ARGS="-f bv*[height<=720]+ba/b[height<=720]/bv*+ba/b --merge-output-format mp4" ;;
            480)   FMT_ARGS="-f bv*[height<=480]+ba/b[height<=480]/bv*+ba/b --merge-output-format mp4" ;;
            *)     FMT_ARGS="-f bv*+ba/b --merge-output-format mp4" ;;
          esac

          COOKIE_ARGS=""
          if [ -f cookies.txt ]; then COOKIE_ARGS="--cookies cookies.txt"; fi
          PROXY_ARGS=""
          if [ -n "$PROXY_URL" ]; then PROXY_ARGS="--proxy $PROXY_URL"; fi

          run_ytdlp() {
            yt-dlp \
              $FMT_ARGS $PROXY_ARGS "$@" \
              --no-playlist --no-progress --newline \
              --retries 5 --fragment-retries 10 \
              --embed-metadata \
              --remote-components ejs:github \
              --ffmpeg-location "$FFMPEG_BIN" \
              -o "out/%(title).120B [%(id)s].%(ext)s" \
              -- "$TARGET_URL"
          }

          IMP="generic:impersonate"
          ALT="youtube:player_client=default,tv,web_safari,mweb"
          if run_ytdlp $COOKIE_ARGS --extractor-args "$IMP"; then :
          elif run_ytdlp $COOKIE_ARGS --extractor-args "$ALT"; then :
          elif run_ytdlp $COOKIE_ARGS --impersonate chrome; then :
          elif run_ytdlp --extractor-args "$IMP" --extractor-args "$ALT"; then :
          else
            echo "::error::download failed"
            rm -f cookies.txt
            exit 1
          fi
          rm -f cookies.txt

      - name: Always drop cookies
        if: always()
        run: rm -f cookies.txt

      - name: Wrap the file in a ZIP (Netfree friendly)
        if: success()
        run: |
          mkdir -p pack
          FIRST=$(cd out && ls | head -1)
          BASE="${FIRST%.*}"
          [ -z "$BASE" ] && BASE="download"
          (cd out && zip -r -0 -q "../pack/${BASE}.zip" .)
          rm -rf out && mv pack out

      - name: Publish as Release (Netfree-friendly download)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: dl-${{ inputs.request_id }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --title "$TAG" --notes "Automated download - safe to delete."
          find out -type f -print0 | while IFS= read -r -d '' f; do
            esc=$(printf '%s' "$f" | sed 's/[][*?\\]/\\&/g')
            gh release upload "$TAG" "$esc" --clobber
          done
          {
            gh release list --limit 200 --json tagName,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[].tagName' 2>/dev/null \
              | grep '^dl-' | tail -n +26 \
              | while read -r old; do gh release delete "$old" --yes --cleanup-tag 2>/dev/null || true; done
          } || true

  # ------------------------------------------------- collection: list what's in it
  enumerate:
    if: inputs.mode == 'collection' || inputs.mode == 'list'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      batches: ${{ steps.list.outputs.batches }}
      collection_name: ${{ steps.list.outputs.name }}
      item_count: ${{ steps.list.outputs.count }}
    steps:
      - name: Validate request id
        run: |
          case "${{ inputs.request_id }}" in
            *[!a-zA-Z0-9-]*|"") echo "::error::request_id must be [a-zA-Z0-9-] only"; exit 1;;
          esac

      - name: Create Release Placeholder
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: dl-${{ inputs.request_id }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --title "$TAG" --notes "Automated collection download - safe to delete." || true

      - name: List collection items
        id: list
        env:
          TARGET_URL: ${{ inputs.url }}
          MODE: ${{ inputs.mode }}
          URLS: ${{ inputs.urls }}
          COOKIES_ENC: ${{ inputs.cookies_enc }}
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade yt-dlp cryptography
          python - <<'PY'
          import base64, json, os, re, secrets, sys
          from urllib.parse import urlsplit, urlunsplit
          import yt_dlp

          TARGET_URL = os.environ["TARGET_URL"]
          MODE = os.environ.get("MODE", "collection")
          MAX_ITEMS = 2000
          CONCURRENCY = 20
          MAX_BATCH = 40

          cookies_path = None
          cookies_enc = os.environ.get("COOKIES_ENC", "")
          cookie_key = os.environ.get("COOKIE_KEY", "")
          if cookies_enc and cookie_key:
              from cryptography.hazmat.primitives.ciphers.aead import AESGCM
              blob = base64.b64decode(cookies_enc)
              key = bytes.fromhex(cookie_key.strip())
              iv, ct = blob[:12], blob[12:]
              try:
                  data = AESGCM(key).decrypt(iv, ct, None)
                  with open("cookies.txt", "wb") as f:
                      f.write(data)
                  cookies_path = "cookies.txt"
              except Exception:
                  print("::error::cookie decryption failed")
                  sys.exit(1)

          def safe_name(name, limit=100):
              name = (name or "").strip()
              if not name or name == "NA":
                  return None
              cleaned = re.sub(r'[ /\\:*?"<>|]+', "_", name)
              return cleaned[:limit] or None

          def resolve_url(entry):
              u = entry.get("url") or entry.get("webpage_url")
              if not u:
                  return None
              if u.startswith("http://") or u.startswith("https://"):
                  return u
              return f"https://www.youtube.com/watch?v={u}"

          ydl_opts = {
              "extract_flat": True,
              "quiet": True,
              "no_warnings": True,
              "skip_download": True,
              "playlistend": MAX_ITEMS,
          }
          if cookies_path:
              ydl_opts["cookiefile"] = cookies_path

          def flat_list(url):
              with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                  return ydl.extract_info(url, download=False)

          def emit_batches(items, collection_name):
              target_jobs = min(len(items), CONCURRENCY)
              batch_size = max(1, -(-len(items) // target_jobs))
              batch_size = min(batch_size, MAX_BATCH)
              batches = [
                  {"i": idx, "items": items[start:start + batch_size]}
                  for idx, start in enumerate(range(0, len(items), batch_size))
              ]
              delim = f"ghadelim_{secrets.token_hex(8)}"
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"batches<<{delim}\n{json.dumps(batches)}\n{delim}\n")
                  f.write(f"name={collection_name}\n")
                  f.write(f"count={len(items)}\n")

          if MODE == "list":
              try:
                  url_list = json.loads(os.environ.get("URLS") or "[]")
              except Exception:
                  url_list = []
              items, seen = [], set()
              for u in url_list:
                  u = u.strip() if isinstance(u, str) else ""
                  if u and u not in seen and len(items) < MAX_ITEMS:
                      seen.add(u)
                      items.append({"id": u, "url": u, "album": ""})
              if not items:
                  sys.exit(1)
              emit_batches(items, "downloads")
              sys.exit(0)

          info = flat_list(TARGET_URL)
          collection_name = (
              safe_name(info.get("title") or info.get("playlist_title") or info.get("channel") or info.get("uploader"))
              or "collection"
          )

          items = []
          host = urlsplit(TARGET_URL).netloc.removeprefix("www.").removeprefix("m.")
          is_youtube = host in ("youtube.com", "music.youtube.com")
          is_single_playlist = (not is_youtube) or "list=" in TARGET_URL

          seen_ids = set()
          def add_entries(entries, album):
              for e in entries or []:
                  if not e or len(items) >= MAX_ITEMS:
                      continue
                  vid = e.get("id")
                  url = resolve_url(e)
                  if vid and url and vid not in seen_ids:
                      seen_ids.add(vid)
                      items.append({"id": vid, "url": url, "album": album})

          if is_single_playlist:
              add_entries(info.get("entries"), "")
          else:
              parts = urlsplit(TARGET_URL)
              segs = [s for s in parts.path.split("/") if s]
              if segs and segs[0] in ("channel", "c", "user") and len(segs) >= 2:
                  base = "/" + "/".join(segs[:2])
              elif segs and segs[0].startswith("@"):
                  base = "/" + segs[0]
              else:
                  base = "/" + segs[0] if segs else ""
              netloc = parts.netloc or "www.youtube.com"

              def channel_tab(tab):
                  return urlunsplit((parts.scheme or "https", netloc, base.rstrip("/") + "/" + tab, "", ""))

              try:
                  pl_info = flat_list(channel_tab("playlists"))
                  for e in pl_info.get("entries") or []:
                      if e and e.get("id"):
                          pl_videos = flat_list(f"https://www.youtube.com/playlist?list={e['id']}")
                          add_entries(pl_videos.get("entries"), safe_name(e.get("title") or e["id"]))
              except Exception:
                  pass

              for tab in ("videos", "shorts", "streams"):
                  try:
                      add_entries(flat_list(channel_tab(tab)).get("entries"), "")
                  except Exception:
                      continue

              if not items:
                  add_entries(info.get("entries"), "")

          if os.path.exists("cookies.txt"):
              os.remove("cookies.txt")

          emit_batches(items, collection_name)
          PY

  # ------------------------------------------ collection: one job per batch
  download-item:
    if: inputs.mode == 'collection' || inputs.mode == 'list'
    needs: enumerate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        batch: ${{ fromJson(needs.enumerate.outputs.batches) }}
    name: download-item ${{ matrix.batch.i }}
    steps:
      - name: Free space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp + ffmpeg
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade yt-dlp cryptography imageio-ffmpeg curl_cffi
          if command -v zip >/dev/null 2>&1; then
            :
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq zip
          fi
          if command -v ffmpeg >/dev/null 2>&1; then
            FFMPEG_BIN=$(command -v ffmpeg)
          else
            FFMPEG_BIN=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
            chmod +x "$FFMPEG_BIN"
          fi
          echo "FFMPEG_BIN=$FFMPEG_BIN" >> "$GITHUB_ENV"

      - name: Decrypt cookies
        if: ${{ inputs.cookies_enc != '' }}
        env:
          COOKIES_ENC: ${{ inputs.cookies_enc }}
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
        run: |
          if [ -z "$COOKIE_KEY" ]; then
            echo "::error::repository secret COOKIE_KEY is missing"
            exit 1
          fi
          python - <<'PY'
          import base64, os, sys
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          blob = base64.b64decode(os.environ["COOKIES_ENC"])
          key = bytes.fromhex(os.environ["COOKIE_KEY"].strip())
          iv, ct = blob[:12], blob[12:]
          try:
              data = AESGCM(key).decrypt(iv, ct, None)
          except Exception:
              sys.exit(1)
          with open("cookies.txt", "wb") as f:
              f.write(data)
          PY

      - name: Download batch
        env:
          BATCH_JSON: ${{ toJson(matrix.batch.items) }}
          QUALITY: ${{ inputs.quality }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          mkdir -p out
          case "$QUALITY" in
            audio) FMT_ARGS="-f bestaudio/best -x --audio-format mp3 --audio-quality 0" ;;
            1080)  FMT_ARGS="-f bv*[height<=1080]+ba/b[height<=1080]/bv*+ba/b --merge-output-format mp4" ;;
            720)   FMT_ARGS="-f bv*[height<=720]+ba/b[height<=720]/bv*+ba/b --merge-output-format mp4" ;;
            480)   FMT_ARGS="-f bv*[height<=480]+ba/b[height<=480]/bv*+ba/b --merge-output-format mp4" ;;
            *)     FMT_ARGS="-f bv*+ba/b --merge-output-format mp4" ;;
          esac

          COOKIE_ARGS=""
          if [ -f cookies.txt ]; then COOKIE_ARGS="--cookies cookies.txt"; fi
          PROXY_ARGS=""
          if [ -n "$PROXY_URL" ]; then PROXY_ARGS="--proxy $PROXY_URL"; fi

          printf '%s' "$BATCH_JSON" | python -c "
          import json, sys
          for it in json.load(sys.stdin):
              print(it['url'] + '\t' + (it.get('album') or ''))
          " > batch.tsv

          run_ytdlp() {
            local tmpl="$1"; shift
            yt-dlp \
              $FMT_ARGS $PROXY_ARGS "$@" \
              --no-playlist --no-progress --newline \
              --retries 5 --fragment-retries 10 \
              --embed-metadata \
              --remote-components ejs:github \
              --ffmpeg-location "$FFMPEG_BIN" \
              -o "$tmpl" \
              -- "$URL"
          }

          IMP="generic:impersonate"
          ALT="youtube:player_client=default,tv,web_safari,mweb"
          while IFS=$'\t' read -r URL ALBUM; do
            [ -z "$URL" ] && continue
            if [ -n "$ALBUM" ]; then
              TMPL="out/$ALBUM/%(title).100B [%(id)s].%(ext)s"
            else
              TMPL="out/%(title).100B [%(id)s].%(ext)s"
            fi
            if   run_ytdlp "$TMPL" $COOKIE_ARGS --extractor-args "$IMP"; then :
            elif run_ytdlp "$TMPL" $COOKIE_ARGS --extractor-args "$ALT"; then :
            elif run_ytdlp "$TMPL" $COOKIE_ARGS --impersonate chrome; then :
            elif run_ytdlp "$TMPL" --extractor-args "$IMP" --extractor-args "$ALT"; then :
            fi
          done < batch.tsv
          rm -f batch.tsv cookies.txt

      - name: Always drop cookies
        if: always()
        run: rm -f cookies.txt

      - name: Package and Upload Part Directly to Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: dl-${{ inputs.request_id }}
          COLLECTION_NAME: ${{ needs.enumerate.outputs.collection_name }}
          BATCH_INDEX: ${{ matrix.batch.i }}
        run: |
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "No files downloaded in this batch"
            exit 0
          fi
          mkdir -p pack
          BASE="${COLLECTION_NAME:-collection}"
          PART_NUM=$(printf "%02d" $((BATCH_INDEX + 1)))
          ZIP_NAME="${BASE}_part${PART_NUM}.zip"
          
          (cd out && zip -r -0 -q "../pack/${ZIP_NAME}" .)
          
          esc=$(printf '%s' "pack/${ZIP_NAME}" | sed 's/[][*?\\]/\\&/g')
          
          for attempt in 1 2 3 4 5; do
            echo "Uploading $ZIP_NAME to release $TAG (attempt $attempt)..."
            if gh release upload "$TAG" "$esc" --clobber; then
              echo "Uploaded $ZIP_NAME successfully!"
              break
            fi
            sleep 5
          done

  # --------------------------------------------------- collection: finish up
  package:
    if: always() && (inputs.mode == 'collection' || inputs.mode == 'list') && needs.enumerate.result == 'success'
    needs: [enumerate, download-item]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Maintain release history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            gh release list --limit 200 --json tagName,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[].tagName' 2>/dev/null \
              | grep '^dl-' | tail -n +26 \
              | while read -r old; do gh release delete "$old" --yes --cleanup-tag 2>/dev/null || true; done
          } || true
