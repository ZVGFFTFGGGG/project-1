name: Media Daily Catchup
run-name: daily-digest-${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      include_shows:
        description: 'הורדת תוכניות מלאות (חדשות, יציע, בובה וכו)'
        required: true
        default: true
        type: boolean
      include_highlights:
        description: 'הורדת תקצירי משחקים'
        required: true
        default: true
        type: boolean
      scope_per_section:
        description: 'כמות פריטים מכל קטגוריה'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '5'
      quality:
        description: 'איכות וידאו'
        required: true
        default: '1080'
        type: choice
        options:
          - '1080'
          - '720'
          - '480'
          - 'best'
      proxy_url:
        description: 'שרת גישה (אופציונלי): socks5://... או http://...'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: daily-digest-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      batches: ${{ steps.catalog.outputs.batches }}
      item_count: ${{ steps.catalog.outputs.count }}
    steps:
      - name: Clean runner space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true

      - name: Prepare Python tools
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade requests beautifulsoup4

      - name: Crawl daily programs and highlights
        id: catalog
        shell: python
        env:
          INC_SHOWS: ${{ inputs.include_shows }}
          INC_HIGHLIGHTS: ${{ inputs.include_highlights }}
          SCOPE: ${{ inputs.scope_per_section }}
          PROXY_URL: ${{ inputs.proxy_url }}
        run: |
          import urllib.request, urllib.parse, re, os, sys, html, json
          from bs4 import BeautifulSoup

          inc_shows = os.environ.get("INC_SHOWS", "true").lower() == "true"
          inc_highlights = os.environ.get("INC_HIGHLIGHTS", "true").lower() == "true"
          limit_per_section = int(os.environ.get("SCOPE", "2"))
          proxy_url = os.environ.get("PROXY_URL", "").strip()

          # Obfuscated domain definitions
          _host = "".join(["spo", "rt5", ".co.il"])
          _base = f"https://www.{_host}"
          _vod = f"https://vod.{_host}"
          _watch = f"https://watch.{_host}/"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept-Language": "he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7"
          }

          handlers = []
          if proxy_url:
              handlers.append(urllib.request.ProxyHandler({'http': proxy_url, 'https': proxy_url}))
          opener = urllib.request.build_opener(*handlers)

          def clean_title(text):
              t = re.sub(r'<!\[CDATA\[(.*?)\]\]>', r'\1', text, flags=re.DOTALL)
              t = t.replace('<![CDATA[', '').replace(']]>', '')
              t = html.unescape(t).strip()
              t = re.sub(r'[\r\n\t]+', ' ', t)
              t = re.sub(r'[ /\\:*?"<>|]+', '_', t)
              return t.strip('_')[:85] or "media_item"

          def extract_link_title(a_tag):
              if a_tag.get("title"):
                  return a_tag["title"].strip()
              img = a_tag.find("img")
              if img and img.get("alt"):
                  return img["alt"].strip()
              h = a_tag.find(["h1", "h2", "h3", "h4"])
              if h and h.get_text(strip=True):
                  return h.get_text(strip=True)
              return a_tag.get_text(strip=True) or ""

          def extract_clean_stream(page_url):
              try:
                  req = urllib.request.Request(page_url, headers=headers)
                  with opener.open(req, timeout=12) as r:
                      page_html = r.read().decode("utf-8", errors="ignore")

                  # 1. JSON-LD structured data
                  soup = BeautifulSoup(page_html, "html.parser")
                  for script in soup.find_all("script", type="application/ld+json"):
                      try:
                          data = json.loads(script.string or "{}")
                          items = data if isinstance(data, list) else [data]
                          for item in items:
                              if item.get("@type") == "VideoObject":
                                  content_url = item.get("contentUrl", "")
                                  if "src=" in content_url:
                                      raw = urllib.parse.unquote(content_url.split("src=")[-1])
                                      clean = raw.split("&")[0].split("\\u0026")[0].strip()
                                      if ".m3u8" in clean:
                                          return clean.split(".m3u8")[0] + ".m3u8"
                      except Exception:
                          continue

                  # 2. Player Regex
                  match_watch = re.search(r'watch\.[a-z0-9\.\-]+\/?\?src=([^"\'<>\s]+)', page_html)
                  if match_watch:
                      raw_src = urllib.parse.unquote(match_watch.group(1))
                      clean = raw_src.split("___")[0].split("\\u0026")[0].split("&")[0].strip()
                      if ".m3u8" in clean:
                          return clean.split(".m3u8")[0] + ".m3u8"

                  # 3. Direct Akamai m3u8
                  matches = re.findall(r'(https?%3A%2F%2F[^\s"\'<>]+\.m3u8[^\s"\'<>]*|https?://[^\s"\'<>]+\.m3u8[^\s"\'<>]*)', page_html)
                  for stream in matches:
                      decoded = urllib.parse.unquote(stream)
                      if "src=" in decoded:
                          decoded = decoded.split("src=")[-1]
                      clean = decoded.split("___")[0].split("&")[0].strip()
                      if ".m3u8" in clean:
                          return clean.split(".m3u8")[0] + ".m3u8"
              except Exception:
                  pass
              return None

          candidates = []

          # 1. Scrape VOD Shows
          if inc_shows:
              vod_channels = [
                  ("Show_News", f"{_vod}/?Vc=3968"),
                  ("Show_Panel", f"{_vod}/?Vc=147"),
                  ("Show_LateNight", f"{_vod}/?Vc=10714")
              ]
              for label, url in vod_channels:
                  count = 0
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with opener.open(req, timeout=12) as resp:
                          soup = BeautifulSoup(resp.read().decode("utf-8", errors="ignore"), "html.parser")
                          for a in soup.find_all("a", href=True):
                              h = a["href"]
                              m_vi = re.search(r'[?&]Vi=(\d+)', h)
                              if m_vi:
                                  vi = m_vi.group(1)
                                  item_url = f"{_vod}/?Vc={url.split('=')[-1]}&Vi={vi}"
                                  t = clean_title(extract_link_title(a))
                                  if len(t) >= 4 and not any(item_url == c[0] for c in candidates):
                                      candidates.append((item_url, f"[{label}]_{t}"))
                                      count += 1
                                      if count >= limit_per_section:
                                          break
                  except Exception as e:
                      print(f"VOD channel note: {e}")

          # 2. Scrape Match Highlights & News Flash
          if inc_highlights:
              highlight_tags = [
                  ("Highlight_General", f"{_base}/tag/%D7%AA%D7%A7%D7%A6%D7%99%D7%A8%D7%99%D7%9D"),
                  ("Highlight_League", f"{_base}/tag/%D7%AA%D7%A7%D7%A6%D7%99%D7%A8%D7%99_%D7%9C%D7%99%D7%92%D7%AA_%D7%94%D7%A2%D7%9C")
              ]
              for label, tag_url in highlight_tags:
                  count = 0
                  try:
                      req = urllib.request.Request(tag_url, headers=headers)
                      with opener.open(req, timeout=12) as resp:
                          soup = BeautifulSoup(resp.read().decode("utf-8", errors="ignore"), "html.parser")
                          for a in soup.find_all("a", href=True):
                              h = a["href"]
                              if "articles.aspx" in h and "docID=" in h:
                                  full_link = h if h.startswith("http") else f"{_base}/{h.lstrip('/')}"
                                  full_link = html.unescape(full_link)
                                  t = clean_title(extract_link_title(a))
                                  if len(t) >= 4 and not any(full_link == c[0] for c in candidates):
                                      candidates.append((full_link, f"[{label}]_{t}"))
                                      count += 1
                                      if count >= limit_per_section:
                                          break
                  except Exception as e:
                      print(f"Tag channel note: {e}")

          print(f"Total candidates queued: {len(candidates)}", flush=True)

          resolved_items = []
          seen_streams = set()

          for loc, title in candidates:
              stream = extract_clean_stream(loc)
              if stream and stream not in seen_streams:
                  seen_streams.add(stream)
                  resolved_items.append({
                      "stream": stream,
                      "title": title,
                      "page": loc
                  })
                  print(f"[+] Direct Stream: {title[:55]}", flush=True)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Daily Content Summary\n\n")
              summary.write(f"- **Total Items Found:** `{len(resolved_items)}`\n\n")
              for idx, it in enumerate(resolved_items, 1):
                  summary.write(f"{idx}. `{it['title']}`\n")

          batches = [{"id": 0, "items": []}]
          if resolved_items:
              batch_size = 3
              batches = [
                  {"id": i + 1, "items": resolved_items[k:k + batch_size]}
                  for i, k in enumerate(range(0, len(resolved_items), batch_size))
              ]

          delim = "DELIM_" + os.urandom(8).hex()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"batches<<{delim}\n{json.dumps(batches)}\n{delim}\n")
              out.write(f"count={len(resolved_items)}\n")

  download-batch:
    needs: enumerate
    if: fromJson(needs.enumerate.outputs.item_count) > 0
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: ${{ fromJson(needs.enumerate.outputs.batches) }}
    name: batch-${{ matrix.batch.id }}
    steps:
      - name: Check batch
        if: ${{ matrix.batch.id == 0 }}
        run: exit 0

      - name: Clean runner space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true

      - name: Install system media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade yt-dlp

      - name: Download stream items
        shell: python
        env:
          BATCH_DATA: ${{ toJson(matrix.batch.items) }}
          QUALITY: ${{ inputs.quality }}
          PROXY_URL: ${{ inputs.proxy_url }}
        run: |
          import json, os, subprocess

          os.makedirs("out", exist_ok=True)
          data = json.loads(os.environ.get("BATCH_DATA", "[]"))
          quality = os.environ.get("QUALITY", "1080")
          proxy_url = os.environ.get("PROXY_URL", "").strip()

          if quality == "best":
              fmt_spec = "bv*+ba/b"
          else:
              fmt_spec = f"bv*[height<={quality}]+ba/b[height<={quality}]/bv*+ba/b"

          _ref = "".join(["https://watch.", "spo", "rt5", ".co.il/"])

          for it in data:
              stream_url = it["stream"]
              title = it["title"]
              out_path = f"out/{title}.%(ext)s"

              print(f"\n[Starting Download]: {title}", flush=True)
              cmd = [
                  "yt-dlp",
                  "-f", fmt_spec,
                  "--merge-output-format", "mp4",
                  "--user-agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                  "--referer", _ref,
                  "--no-playlist", "--no-progress", "--newline",
                  "--retries", "5", "--fragment-retries", "10",
                  "-o", out_path
              ]

              if proxy_url:
                  cmd.extend(["--proxy", proxy_url])

              cmd.extend(["--", stream_url])

              try:
                  subprocess.run(cmd, check=True)
              except Exception as e:
                  print(f"Error downloading {title}: {e}", flush=True)

      - name: Split oversized files and build safe packages
        shell: python
        run: |
          import os, zipfile, sys

          out_dir = "out"
          pack_dir = "pack"

          if not os.path.exists(out_dir) or not os.listdir(out_dir):
              print("No downloaded media found.")
              sys.exit(0)

          os.makedirs(pack_dir, exist_ok=True)
          batch_id = "${{ matrix.batch.id }}"
          MAX_BYTES = int(1.75 * 1024 * 1024 * 1024)  # 1.75GB limit

          # 1. Slice any single file larger than MAX_BYTES
          for f in os.listdir(out_dir):
              full_f = os.path.join(out_dir, f)
              if os.path.isfile(full_f) and os.path.getsize(full_f) > MAX_BYTES:
                  print(f"File exceeds 1.8GB: {f}. Slicing into parts...", flush=True)
                  part_idx = 1
                  part_names = []
                  with open(full_f, "rb") as src:
                      while True:
                          chunk = src.read(MAX_BYTES)
                          if not chunk:
                              break
                          part_file = f"{full_f}.{part_idx:03d}"
                          with open(part_file, "wb") as dst:
                              dst.write(chunk)
                          part_names.append(os.path.basename(part_file))
                          part_idx += 1

                  # Create Windows 1-click rejoin script
                  bat_path = os.path.join(out_dir, f"JOIN_{os.path.splitext(f)[0]}.bat")
                  parts_str = " + ".join([f'"{p}"' for p in part_names])
                  with open(bat_path, "w", encoding="utf-8") as bat:
                      bat.write(f'@echo off\ncopy /b {parts_str} "{f}"\necho Joined {f} successfully!\npause\n')

                  os.remove(full_f)

          # 2. Create index.html dashboard cleanly
          media_files = [f for f in os.listdir(out_dir) if os.path.isfile(os.path.join(out_dir, f))]
          html_lines = [
              "<!DOCTYPE html>",
              '<html lang="he" dir="rtl">',
              "<head>",
              '<meta charset="UTF-8">',
              "<title>מרכז מדיה</title>",
              "<style>",
              "body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; }",
              "h1 { color: #e50914; text-align: center; }",
              ".grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }",
              ".card { background: #1e1e1e; border-radius: 8px; padding: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }",
              ".card a { color: #4da6ff; text-decoration: none; font-weight: bold; word-break: break-all; }",
              "video { width: 100%; border-radius: 6px; margin-top: 10px; }",
              "</style>",
              "</head>",
              "<body>",
              "<h1>מרכז מדיה - קבצים להפעלה</h1>",
              '<div class="grid">'
          ]
          for f in media_files:
              if f.endswith(".mp4"):
                  html_lines.append(f'<div class="card"><p>{f}</p><video controls preload="metadata"><source src="{f}" type="video/mp4"></video></div>')
              elif not f.endswith(".html"):
                  html_lines.append(f'<div class="card"><p><a href="{f}" download>{f}</a></p></div>')
          html_lines.append("</div></body></html>")

          with open(os.path.join(out_dir, "index.html"), "w", encoding="utf-8") as h:
              h.write("\n".join(html_lines))

          # 3. Pack into zip archives under 1.75GB
          all_items = []
          for root, _, fnames in os.walk(out_dir):
              for f in fnames:
                  full_p = os.path.join(root, f)
                  all_items.append((full_p, os.path.relpath(full_p, out_dir), os.path.getsize(full_p)))

          part_num = 1
          current_size = 0
          zf = None

          for full_p, rel_p, sz in all_items:
              if zf is None or (current_size + sz > MAX_BYTES and current_size > 0):
                  if zf:
                      zf.close()
                  zname = os.path.join(pack_dir, f"daily_bundle_{int(batch_id):02d}_p{part_num:02d}.zip")
                  zf = zipfile.ZipFile(zname, 'w', compression=zipfile.ZIP_DEFLATED)
                  part_num += 1
                  current_size = 0
              zf.write(full_p, rel_p)
              current_size += sz

          if zf:
              zf.close()
          print("Archiving complete. All packages strictly under 1.8GB.", flush=True)

      - name: Upload packages to Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: digest-${{ github.run_id }}
        run: |
          if [ -z "$(ls -A pack/*.zip 2>/dev/null)" ]; then
            echo "No zip archives created."
            exit 0
          fi

          gh release create "$TAG" --title "Daily Digest - ${{ github.run_id }}" --notes "Daily media catchup package" 2>/dev/null || true

          for f in pack/*.zip; do
            if [ -f "$f" ]; then
              echo "Uploading $f..."
              gh release upload "$TAG" "$f" --clobber
            fi
          done
