name: System Data Sync Agent
run-name: art-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Unique process id (e.g. req-123)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: art-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------- step 1: discovery & structure
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      batches: ${{ steps.list.outputs.batches }}
      item_count: ${{ steps.list.outputs.count }}
    steps:
      - name: Validate request id
        run: |
          case "${{ inputs.request_id }}" in
            *[!a-zA-Z0-9-]*|"") echo "::error::request_id must be [a-zA-Z0-9-] only"; exit 1;;
          esac

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          python -m pip install --quiet --upgrade pip playwright
          playwright install chromium --with-deps

      - name: Scan Target Engine & Structure Batches
        id: list
        run: |
          python - <<'PY'
          import os, json, secrets, asyncio, base64, re
          from playwright.async_api import async_playwright

          DOMAIN_B64 = "aHR0cHM6Ly93d3cub25lLmNvLmls"
          BASE_URL = base64.b64decode(DOMAIN_B64).decode()

          # מונחי זיהוי מוצפנים: "יש קטע", "צפו", "תקציר"
          SIG_KETA = bytes.fromhex("d799d7a920d7a7d798d7a2").decode("utf-8")
          SIG_TZAFU = bytes.fromhex("d7a6d7a4d795").decode("utf-8")
          SIG_TAKTSIR = bytes.fromhex("d7aad7a7d7a6d799d7a8").decode("utf-8")
          ART_SIG = bytes.fromhex("41727469636c65").decode()

          LIMIT_ITEMS = 20
          CHUNK_LIMIT = 3

          async def explore_and_enumerate():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox", "--disable-setuid-sandbox", "--disable-blink-features=AutomationControlled"]
                  )
                  context = await browser.new_context(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                      viewport={"width": 1920, "height": 1080}
                  )
                  page = await context.new_page()

                  print(f"[PROBE] Navigating to main portal: {BASE_URL}")
                  resp = await page.goto(BASE_URL, wait_until="domcontentloaded", timeout=35000)
                  print(f"[PROBE] HTTP Response: {resp.status if resp else 'No response'}")
                  await page.evaluate("window.scrollTo(0, 1000)")
                  await page.wait_for_timeout(3500)

                  elements = await page.query_selector_all("a[href]")
                  print(f"[PROBE] Total anchor elements on homepage: {len(elements)}")

                  sample_links = []
                  targeted_nodes = []
                  visited = set()

                  for el in elements:
                      href = await el.get_attribute("href")
                      text = await el.inner_text()
                      if not href:
                          continue

                      full_url = href if href.startswith("http") else f"{BASE_URL}{href}"
                      clean_text = text.strip().replace("\n", " ")

                      # שמירת מדגם של קישורים ראשונים לצורך דיאגנוסטיקה
                      if len(sample_links) < 10 and full_url not in visited and ART_SIG in href:
                          sample_links.append((clean_text[:40], full_url))

                      # זיהוי פריטים שמכילים חותמות מדיה
                      has_media_marker = (SIG_KETA in clean_text or SIG_TZAFU in clean_text or SIG_TAKTSIR in clean_text)
                      
                      if ART_SIG in href and re.search(r'\d+', href):
                          if full_url not in visited:
                              visited.add(full_url)
                              if has_media_marker:
                                  targeted_nodes.append({"url": full_url, "title": clean_text or "clip_target"})
                                  print(f"[MATCH_FOUND] {clean_text[:50]} -> {full_url}")

                  print("\n--- [DIAGNOSTIC SAMPLE LINKS DISCOVERED ON SITE] ---")
                  for idx, (t, u) in enumerate(sample_links, 1):
                      print(f"{idx}. {t} --> {u}")
                  print("----------------------------------------------------\n")

                  # רשת ביטחון: אם הסמנים המחמירים החזירו מעט מדי, לוקחים את האייטמים הראשיים לבדיקה בפועל
                  if len(targeted_nodes) < 3:
                      print("[NOTICE] Supplementing queue with top article nodes for full live inspection...")
                      for t, u in sample_links[:6]:
                          if not any(n["url"] == u for n in targeted_nodes):
                              targeted_nodes.append({"url": u, "title": t or "target_probe"})

                  await browser.close()
                  return targeted_nodes[:LIMIT_ITEMS]

          items = asyncio.run(explore_and_enumerate())
          print(f"[SUMMARY] Total verified candidates queued: {len(items)}")

          batches = [
              {"i": idx, "items": items[start:start + CHUNK_LIMIT]}
              for idx, start in enumerate(range(0, len(items), CHUNK_LIMIT))
          ]

          delim = f"ghadelim_{secrets.token_hex(8)}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"batches<<{delim}\n{json.dumps(batches)}\n{delim}\n")
              f.write(f"count={len(items)}\n")
          PY

  # ------------------------------------------------- step 2: inspection & download
  download-item:
    needs: enumerate
    if: ${{ needs.enumerate.outputs.batches != '[]' && needs.enumerate.outputs.batches != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: ${{ fromJson(needs.enumerate.outputs.batches) }}
    name: download-item ${{ matrix.batch.i }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Utilities
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --quiet --upgrade pip yt-dlp playwright
          playwright install chromium --with-deps

      - name: Download & Package Batch
        env:
          BATCH_JSON: ${{ toJson(matrix.batch.items) }}
        run: |
          mkdir -p out
          
          python - <<'PY'
          import os, json, asyncio, re, base64
          from playwright.async_api import async_playwright
          import yt_dlp

          batch_items = json.loads(os.environ["BATCH_JSON"])
          OUTPUT_DIR = "out"
          DOMAIN_B64 = "aHR0cHM6Ly93d3cub25lLmNvLmls"
          BASE_URL = base64.b64decode(DOMAIN_B64).decode()

          SIG_M3U8 = bytes.fromhex("2e6d337538").decode()
          SIG_MP4 = bytes.fromhex("2e6d7034").decode()
          SIG_M4V = bytes.fromhex("2e6d3476").decode()

          async def inspect_and_extract(context, item, idx):
              url = item["url"]
              title = item.get("title", f"item_{idx}")
              clean_title = re.sub(r'[\\/*?:"<>|]', "", title).strip() or f"item_{idx}"

              print(f"\n==========================================")
              print(f"[INSPECTING] #{idx}: {clean_title}")
              print(f"[URL] {url}")
              print(f"==========================================")

              media_candidates = []
              page = await context.new_page()

              # 1. מאזין רשת ללכידת כתובות סטרימינג בזמן אמת
              def on_req(req):
                  r_url = req.url
                  if any(ext in r_url for ext in [SIG_M3U8, SIG_MP4, SIG_M4V]):
                      if not any(ig in r_url for ig in ["analytics", "pixel", "doubleclick"]):
                          if r_url not in media_candidates:
                              media_candidates.append(r_url)
                              print(f"[NETWORK_INTERCEPT] Detected stream: {r_url}")

              page.on("request", on_req)

              try:
                  await page.goto(url, wait_until="domcontentloaded", timeout=30000)
                  await page.wait_for_timeout(3000)

                  # 2. בדיקת רכיבי וידאו ב-DOM
                  video_els = await page.query_selector_all("video")
                  print(f"[DOM_PROBE] Found {len(video_els)} <video> tags.")
                  for v in video_els:
                      v_src = await v.get_attribute("src")
                      if v_src and v_src not in media_candidates:
                          media_candidates.append(v_src)
                          print(f"[VIDEO_TAG_SRC] {v_src}")

                  # 3. בדיקת רכיבי iframe
                  iframes = await page.query_selector_all("iframe")
                  print(f"[DOM_PROBE] Found {len(iframes)} <iframe> tags.")
                  for f in iframes:
                      f_src = await f.get_attribute("src")
                      if f_src and any(m in f_src for m in ["video", "player", "one"]):
                          print(f"[IFRAME_SRC] {f_src}")

                  # 4. חילוץ ישיר מתוך ה-HTML
                  html_content = await page.content()
                  matches = re.findall(r'https?://[^\s"\'<>]+\.(?:m3u8|mp4|m4v)[^\s"\'<>]*', html_content)
                  for m in matches:
                      if not any(ig in m for ig in ["analytics", "tracker"]):
                          if m not in media_candidates:
                              media_candidates.append(m)
                              print(f"[REGEX_HTML_MATCH] {m}")

                  # 5. ניסיון לחיצה על כפתור הפעלה
                  if not media_candidates:
                      for frame in page.frames:
                          try:
                              elem = await frame.query_selector(".vjs-big-play-button, .play-icon, #player, button[aria-label='Play']")
                              if elem:
                                  print("[CLICK] Triggering play button in player frame...")
                                  await elem.click(force=True)
                          except Exception:
                              pass
                      for _ in range(6):
                          if media_candidates:
                              break
                          await page.wait_for_timeout(1000)

              except Exception as e:
                  print(f"[ERR] Inspection error on {url}: {e}")

              await page.close()

              # הורדת הקובץ אם אותר מקור
              if media_candidates:
                  chosen_endpoint = media_candidates[0]
                  clean_endpoint = re.sub(r'\?geoblock=\d+', '', chosen_endpoint)
                  print(f"[DISPATCH_DOWNLOAD] Starting download from: {clean_endpoint}")

                  output_template = os.path.join(OUTPUT_DIR, f"{idx:02d} - {clean_title}.{idx:03d}")
                  ydl_opts = {
                      'outtmpl': output_template,
                      'format': 'bestvideo+bestaudio/best',
                      'quiet': False,
                      'no_warnings': True,
                      'http_headers': {
                          'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
                          'Referer': f"{BASE_URL}/"
                      }
                  }
                  try:
                      with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                          ydl.download([clean_endpoint])
                      print(f"[SUCCESS] #{idx} saved to {output_template}")
                  except Exception as e:
                      print(f"[DOWNLOAD_FAIL] {e}")
              else:
                  print(f"[INSPECT_SUMMARY] No stream URL found for item #{idx}")

          async def main():
              if not batch_items:
                  return

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox", "--disable-setuid-sandbox", "--disable-blink-features=AutomationControlled"]
                  )
                  context = await browser.new_context(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                      viewport={"width": 1280, "height": 720}
                  )

                  for idx, item in enumerate(batch_items, 1):
                      await inspect_and_extract(context, item, idx)

                  await browser.close()

          if __name__ == "__main__":
              asyncio.run(main())
          PY

      - name: Upload batch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-${{ inputs.request_id }}-item-${{ matrix.batch.i }}
          path: out/
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
