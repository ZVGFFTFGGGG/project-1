name: System Data Sync Agent
run-name: art-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Unique process id (e.g. req-123)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: art-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------- step 1: dynamic enumeration
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      batches: ${{ steps.list.outputs.batches }}
      item_count: ${{ steps.list.outputs.count }}
    steps:
      - name: Validate request id
        run: |
          case "${{ inputs.request_id }}" in
            *[!a-zA-Z0-9-]*|"") echo "::error::request_id must be [a-zA-Z0-9-] only"; exit 1;;
          esac

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          python -m pip install --quiet --upgrade pip playwright yt-dlp
          playwright install chromium --with-deps

      - name: Scan Target Engine & Structure Batches
        id: list
        run: |
          python - <<'PY'
          import os, json, secrets, asyncio, base64, re
          from playwright.async_api import async_playwright

          DOMAIN_B64 = "aHR0cHM6Ly93d3cub25lLmNvLmls"
          BASE_URL = base64.b64decode(DOMAIN_B64).decode()
          
          VOD_SIG = bytes.fromhex("564f44").decode()
          ART_SIG = bytes.fromhex("41727469636c65").decode()
          
          # מונחי סינון מוצפנים: "צפו", "תקציר"
          SIG_TZAFU = bytes.fromhex("d7a6d7a4d795").decode("utf-8")
          SIG_TAKTSIR = bytes.fromhex("d7aad7a7d7a6d799d7a8").decode("utf-8")
          
          LIMIT_ITEMS = 30
          CHUNK_LIMIT = 3

          async def fetch_nodes():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=[
                          "--no-sandbox",
                          "--disable-setuid-sandbox",
                          "--disable-blink-features=AutomationControlled"
                      ]
                  )
                  context = await browser.new_context(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                      viewport={"width": 1920, "height": 1080}
                  )
                  page = await context.new_page()
                  
                  nodes, visited = [], set()
                  
                  # סריקה ממוקדת קודם כל במתחם המדיה והתקצירים
                  targets = [
                      f"{BASE_URL}/{VOD_SIG}",
                      f"{BASE_URL}/{VOD_SIG}/",
                      BASE_URL
                  ]
                  
                  for target in targets:
                      try:
                          print(f"[NAVIGATE] Loading: {target}")
                          resp = await page.goto(target, wait_until="domcontentloaded", timeout=30000)
                          print(f"[STATUS] {resp.status if resp else 'none'}")
                          # המתנה קצרה לטעינת רכיבי הצפייה הדינמיים
                          await page.wait_for_timeout(4000)
                          
                          elements = await page.query_selector_all("a[href]")
                          print(f"[INFO] Scanning {len(elements)} links on {target}...")
                          
                          for el in elements:
                              href = await el.get_attribute("href")
                              text = await el.inner_text()
                              
                              if not href:
                                  continue
                              
                              # בדיקה האם מדובר בפריט תקציר אמיתי
                              is_vod_clip = f"/{VOD_SIG}/" in href and re.search(r'\d+', href)
                              is_clip_article = (ART_SIG in href and re.search(r'\d+', href) and 
                                                (SIG_TZAFU in text or SIG_TAKTSIR in text))
                              
                              if is_vod_clip or is_clip_article:
                                  full_url = href if href.startswith("http") else f"{BASE_URL}{href}"
                                  
                                  if full_url not in visited:
                                      visited.add(full_url)
                                      clean_title = text.strip().replace("\n", " ")
                                      if len(clean_title) < 3:
                                          clean_title = f"clip_{len(nodes) + 1}"
                                          
                                      nodes.append({"url": full_url, "title": clean_title})
                                      print(f"[FOUND_CLIP] {clean_title} -> {full_url}")
                                      
                                      if len(nodes) >= LIMIT_ITEMS:
                                          break
                      except Exception as e:
                          print(f"[ERR] Error processing {target}: {e}")
                      
                      if len(nodes) >= LIMIT_ITEMS:
                          break

                  await browser.close()
                  return nodes

          items = asyncio.run(fetch_nodes())
          print(f"[DIAGNOSTIC] Total targeted clips confirmed: {len(items)}")

          batches = [
              {"i": idx, "items": items[start:start + CHUNK_LIMIT]}
              for idx, start in enumerate(range(0, len(items), CHUNK_LIMIT))
          ]

          delim = f"ghadelim_{secrets.token_hex(8)}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"batches<<{delim}\n{json.dumps(batches)}\n{delim}\n")
              f.write(f"count={len(items)}\n")
          PY

  # ------------------------------------------------- step 2: parallel matrix downloads
  download-item:
    needs: enumerate
    if: ${{ needs.enumerate.outputs.batches != '[]' && needs.enumerate.outputs.batches != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: ${{ fromJson(needs.enumerate.outputs.batches) }}
    name: download-item ${{ matrix.batch.i }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Utilities
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --quiet --upgrade pip yt-dlp playwright
          playwright install chromium --with-deps

      - name: Download & Package Batch
        env:
          BATCH_JSON: ${{ toJson(matrix.batch.items) }}
        run: |
          mkdir -p out
          
          python - <<'PY'
          import os, json, asyncio, re, base64
          from playwright.async_api import async_playwright
          import yt_dlp

          batch_items = json.loads(os.environ["BATCH_JSON"])
          OUTPUT_DIR = "out"

          DOMAIN_B64 = "aHR0cHM6Ly93d3cub25lLmNvLmls"
          BASE_URL = base64.b64decode(DOMAIN_B64).decode()

          EXT_M3U8 = bytes.fromhex("2e6d337538").decode()
          EXT_MP4 = bytes.fromhex("2e6d7034").decode()

          MEDIA_PATTERNS = ["one.co.il", "onevod", "amazonaws", "wow4geo"]

          async def capture_stream(context, item, idx):
              url = item["url"]
              original_title = item.get("title", f"item_{idx}")
              
              clean_title = re.sub(r'[\\/*?:"<>|]', "", original_title).strip()
              if not clean_title:
                  clean_title = f"item_{idx}"

              target_endpoint = None
              page = await context.new_page()

              # האזנה פסיבית לכל בקשת רשת
              def on_request(request):
                  nonlocal target_endpoint
                  req_url = request.url
                  
                  if EXT_M3U8 in req_url and not target_endpoint:
                      target_endpoint = req_url
                  elif EXT_MP4 in req_url and any(h in req_url for h in MEDIA_PATTERNS) and not target_endpoint:
                      target_endpoint = req_url

              page.on("request", on_request)

              try:
                  print(f"\n[FETCHING] #{idx} -> {url}")
                  await page.goto(url, wait_until="domcontentloaded", timeout=25000)
                  await page.wait_for_timeout(2000)

                  # 1. חיפוש נתיב ישיר בתוך קוד המקור
                  content = await page.content()
                  direct_candidates = re.findall(r'https?://[^\s"\'<>]+\.(?:mp4|m3u8)', content)
                  for cand in direct_candidates:
                      if any(h in cand for h in MEDIA_PATTERNS):
                          target_endpoint = cand
                          print(f"[FOUND_DIRECT_SOURCE] {target_endpoint}")
                          break

                  # 2. ניסיון לחיצה על כפתור נגן אם עדיין לא נלכד
                  if not target_endpoint:
                      for frame in page.frames:
                          try:
                              elem = await frame.query_selector(".vjs-big-play-button, .play-icon, #player, button[aria-label='Play']")
                              if elem:
                                  await elem.click(force=True)
                          except Exception:
                              pass

                      for _ in range(8):
                          if target_endpoint:
                              break
                          await page.wait_for_timeout(1000)

              except Exception as e:
                  print(f"[WARN] Navigation issue on {url}: {e}")

              await page.close()

              if target_endpoint:
                  print(f"[DISPATCH] Downloading endpoint: {target_endpoint}")
                  output_template = os.path.join(OUTPUT_DIR, f"{idx:02d} - {clean_title}.{idx:03d}")
                  ydl_opts = {
                      'outtmpl': output_template,
                      'format': 'bestvideo+bestaudio/best',
                      'quiet': False,
                      'no_warnings': True,
                      'http_headers': {
                          'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
                          'Referer': f"{BASE_URL}/"
                      }
                  }
                  try:
                      with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                          ydl.download([target_endpoint])
                      print(f"[SUCCESS] #{idx} downloaded successfully.")
                  except Exception as e:
                      print(f"[DOWNLOAD_ERR] {e}")
              else:
                  print(f"[SKIP_ITEM] No media endpoint detected for {url}")

          async def main():
              if not batch_items:
                  return

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=[
                          "--no-sandbox",
                          "--disable-setuid-sandbox",
                          "--disable-blink-features=AutomationControlled"
                      ]
                  )
                  context = await browser.new_context(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                      viewport={"width": 1280, "height": 720}
                  )

                  for idx, item in enumerate(batch_items, 1):
                      await capture_stream(context, item, idx)

                  await browser.close()

          if __name__ == "__main__":
              asyncio.run(main())
          PY

      - name: Upload batch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-${{ inputs.request_id }}-item-${{ matrix.batch.i }}
          path: out/
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
