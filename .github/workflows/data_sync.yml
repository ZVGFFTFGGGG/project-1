name: System Data Sync Agent
run-name: art-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Unique process id (e.g. probe-101)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: art-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------- step 1: discovery & queuing
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      batches: ${{ steps.list.outputs.batches }}
      item_count: ${{ steps.list.outputs.count }}
    steps:
      - name: Validate request id
        run: |
          case "${{ inputs.request_id }}" in
            *[!a-zA-Z0-9-]*|"") echo "::error::request_id must be [a-zA-Z0-9-] only"; exit 1;;
          esac

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          python -m pip install --quiet --upgrade pip playwright
          playwright install chromium --with-deps

      - name: Scan Target Engine & Structure Batches
        id: list
        run: |
          python - <<'PY'
          import os, json, secrets, asyncio, base64, re
          from playwright.async_api import async_playwright

          TARGET_HOST_B64 = "aHR0cHM6Ly93d3cuc3BvcnQ1LmNvLmls"
          BASE_URL = base64.b64decode(TARGET_HOST_B64).decode()

          SIG_TZAFU = bytes.fromhex("d7a6d7a4d795").decode("utf-8")
          SIG_TAKTSIR = bytes.fromhex("d7aad7a7d7a6d799d7a8").decode("utf-8")
          ART_PATH = "articles.aspx"

          REQ_FILTER = "${{ inputs.request_id }}".lower()
          LIMIT_ITEMS = 10
          CHUNK_LIMIT = 2

          async def harvest_clips():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox", "--disable-setuid-sandbox", "--disable-blink-features=AutomationControlled"]
                  )
                  context = await browser.new_context(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                      viewport={"width": 1920, "height": 1080}
                  )
                  page = await context.new_page()

                  print(f"[HARVESTER] Accessing source: {BASE_URL}")
                  await page.goto(BASE_URL, wait_until="domcontentloaded", timeout=30000)
                  await page.evaluate("window.scrollTo(0, 1200)")
                  await page.wait_for_timeout(3000)

                  elements = await page.query_selector_all(f"a[href*='{ART_PATH}']")
                  print(f"[INFO] Discovered {len(elements)} article links.")

                  nodes, visited = [], set()

                  for el in elements:
                      href = await el.get_attribute("href")
                      text = await el.inner_text()
                      if not href:
                          continue

                      full_url = href if href.startswith("http") else f"{BASE_URL}/{href.lstrip('/')}"
                      clean_text = text.strip().replace("\n", " ")

                      is_clip_entry = (SIG_TZAFU in clean_text or SIG_TAKTSIR in clean_text)

                      if is_clip_entry and full_url not in visited:
                          visited.add(full_url)
                          
                          if any(k in REQ_FILTER for k in ["barca", "maccabi", "madrid", "nba"]):
                              key = REQ_FILTER.split("-")[0]
                              if key not in clean_text.lower():
                                  continue

                          nodes.append({"url": full_url, "title": clean_text})
                          print(f"[MATCH_FOUND] {clean_text} -> {full_url}")

                          if len(nodes) >= LIMIT_ITEMS:
                              break

                  if len(nodes) < 2:
                      for el in elements:
                          href = await el.get_attribute("href")
                          text = await el.inner_text()
                          if not href:
                              continue
                          full_url = href if href.startswith("http") else f"{BASE_URL}/{href.lstrip('/')}"
                          clean_text = text.strip().replace("\n", " ")
                          if (SIG_TZAFU in clean_text or SIG_TAKTSIR in clean_text) and full_url not in visited:
                              visited.add(full_url)
                              nodes.append({"url": full_url, "title": clean_text})
                              if len(nodes) >= 4:
                                  break

                  await browser.close()
                  return nodes

          items = asyncio.run(harvest_clips())
          print(f"\n[SUMMARY] Total confirmed video entries queued: {len(items)}")

          batches = [
              {"i": idx, "items": items[start:start + CHUNK_LIMIT]}
              for idx, start in enumerate(range(0, len(items), CHUNK_LIMIT))
          ]

          delim = f"ghadelim_{secrets.token_hex(8)}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"batches<<{delim}\n{json.dumps(batches)}\n{delim}\n")
              f.write(f"count={len(items)}\n")
          PY

  # ------------------------------------------------- step 2: capture stream & download
  download-item:
    needs: enumerate
    if: ${{ needs.enumerate.outputs.batches != '[]' && needs.enumerate.outputs.batches != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: ${{ fromJson(needs.enumerate.outputs.batches) }}
    name: download-item ${{ matrix.batch.i }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Utilities
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --quiet --upgrade pip yt-dlp playwright
          playwright install chromium --with-deps

      - name: Download & Package Batch
        env:
          BATCH_JSON: ${{ toJson(matrix.batch.items) }}
        run: |
          mkdir -p out
          
          python - <<'PY'
          import os, json, asyncio, re, base64
          from playwright.async_api import async_playwright
          import yt_dlp

          batch_items = json.loads(os.environ["BATCH_JSON"])
          OUTPUT_DIR = "out"

          EXT_M3U8 = bytes.fromhex("2e6d337538").decode()
          EXT_MP4 = bytes.fromhex("2e6d7034").decode()

          # מארחי וידאו מוכרים של האתר
          VALID_HOSTS = ["akamaized", "kaltura", "sport5", "cdn", "live"]

          async def capture_and_download(context, item, idx):
              url = item["url"]
              title = item.get("title", f"clip_{idx}")
              clean_title = re.sub(r'[\\/*?:"<>|]', "", title).strip() or f"clip_{idx}"

              print(f"\n==========================================")
              print(f"[PROCESSING] #{idx}: {clean_title}")
              print(f"[PAGE_URL] {url}")
              print(f"==========================================")

              target_stream = None
              page = await context.new_page()

              # מאזין רשת ללכידת כתובת הזרמת הווידאו מהנגן
              def on_request(req):
                  nonlocal target_stream
                  req_url = req.url
                  
                  # איתור קובץ m3u8 או mp4 ממקורות הווידאו
                  if EXT_M3U8 in req_url and not target_stream:
                      if any(h in req_url for h in VALID_HOSTS) or "master" in req_url or "playlist" in req_url:
                          target_stream = req_url
                          print(f"[INTERCEPTED_STREAM] {req_url}")
                  elif EXT_MP4 in req_url and any(h in req_url for h in VALID_HOSTS) and not target_stream:
                      target_stream = req_url
                      print(f"[INTERCEPTED_MP4] {req_url}")

              page.on("request", on_request)

              try:
                  await page.goto(url, wait_until="domcontentloaded", timeout=25000)
                  await page.wait_for_timeout(2000)

                  # לחיצה על כפתור הנגן להפעלת השידור במידה ואינו מתחיל אוטומטית
                  if not target_stream:
                      for frame in page.frames:
                          try:
                              elem = await frame.query_selector(".vjs-big-play-button, .play-icon, #player, .playBtn, button")
                              if elem:
                                  await elem.click(force=True)
                          except Exception:
                              pass

                      for _ in range(8):
                          if target_stream:
                              break
                          await page.wait_for_timeout(1000)

              except Exception as e:
                  print(f"[WARN] Navigation issue on {url}: {e}")

              await page.close()

              if target_stream:
                  print(f"[DOWNLOADING_DIRECT] {target_stream}")
                  output_template = os.path.join(OUTPUT_DIR, f"{idx:02d} - {clean_title}.{idx:03d}")
                  ydl_opts = {
                      'outtmpl': output_template,
                      'format': 'bestvideo+bestaudio/best',
                      'quiet': False,
                      'no_warnings': True
                  }
                  try:
                      with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                          ydl.download([target_stream])
                      print(f"[SUCCESS] #{idx} saved to {output_template}")
                  except Exception as e:
                      print(f"[DOWNLOAD_FAILED] #{idx}: {e}")
              else:
                  print(f"[FAILED_INTERCEPT] Could not capture direct stream for {url}")

          async def main():
              if not batch_items:
                  return

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox", "--disable-setuid-sandbox", "--disable-blink-features=AutomationControlled"]
                  )
                  context = await browser.new_context(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                      viewport={"width": 1920, "height": 1080}
                  )

                  for idx, item in enumerate(batch_items, 1):
                      await capture_and_download(context, item, idx)

                  await browser.close()

          if __name__ == "__main__":
              asyncio.run(main())
          PY

      - name: Upload batch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-${{ inputs.request_id }}-item-${{ matrix.batch.i }}
          path: out/
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
