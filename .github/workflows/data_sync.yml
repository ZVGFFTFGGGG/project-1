name: System Data Sync Agent
run-name: art-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Unique process id (e.g. barca-123)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: art-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------- step 1: target extraction
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      batches: ${{ steps.list.outputs.batches }}
      item_count: ${{ steps.list.outputs.count }}
    steps:
      - name: Validate request id
        run: |
          case "${{ inputs.request_id }}" in
            *[!a-zA-Z0-9-]*|"") echo "::error::request_id must be [a-zA-Z0-9-] only"; exit 1;;
          esac

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          python -m pip install --quiet --upgrade pip yt-dlp

      - name: Scan Target Engine & Structure Batches
        id: list
        run: |
          python - <<'PY'
          import os, json, secrets, base64, subprocess

          SRC_B64 = "aHR0cHM6Ly93d3cueW91dHViZS5jb20vQG9uZS0xMDA0L3ZpZGVvcw=="
          SRC_URL = base64.b64decode(SRC_B64).decode()

          REQ_RAW = "${{ inputs.request_id }}".lower()
          LIMIT_ITEMS = 12
          CHUNK_LIMIT = 2

          print(f"[EXTRACTOR] Fetching clip inventory...")

          cmd = [
              "yt-dlp",
              "--flat-playlist",
              "--dump-json",
              "--playlist-end", "50",
              SRC_URL
          ]

          res = subprocess.run(cmd, capture_output=True, text=True)
          nodes = []

          for line in res.stdout.strip().split("\n"):
              if not line:
                  continue
              try:
                  entry = json.loads(line)
                  title = entry.get("title", "")
                  v_id = entry.get("id") or entry.get("url")
                  
                  if not v_id or not title:
                      continue

                  title_low = title.lower()
                  # סינון תקצירי ברצלונה / בארסה
                  if any(k in title_low for k in ["barca", "barcelona", "ברצלונה", "בארסה"]):
                      target_url = f"https://www.youtube.com/watch?v={v_id}" if not str(v_id).startswith("http") else str(v_id)
                      nodes.append({"id": v_id, "title": title, "url": target_url})
                      print(f"[MATCH_FOUND] {title}")
                      
                      if len(nodes) >= LIMIT_ITEMS:
                          break
              except Exception:
                  pass

          # אם הועלו מעט מחזורים ברצף האחרון, נמלא ביתר התקצירים האחרונים
          if len(nodes) < 2:
              for line in res.stdout.strip().split("\n"):
                  if not line or len(nodes) >= LIMIT_ITEMS:
                      break
                  try:
                      entry = json.loads(line)
                      title = entry.get("title", "")
                      v_id = entry.get("id") or entry.get("url")
                      target_url = f"https://www.youtube.com/watch?v={v_id}" if not str(v_id).startswith("http") else str(v_id)
                      if not any(n["url"] == target_url for n in nodes):
                          nodes.append({"id": v_id, "title": title, "url": target_url})
                  except Exception:
                      pass

          print(f"\n[SUMMARY] Total confirmed clips prepared: {len(nodes)}")

          batches = [
              {"i": idx, "items": nodes[start:start + CHUNK_LIMIT]}
              for idx, start in enumerate(range(0, len(nodes), CHUNK_LIMIT))
          ]

          delim = f"ghadelim_{secrets.token_hex(8)}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"batches<<{delim}\n{json.dumps(batches)}\n{delim}\n")
              f.write(f"count={len(nodes)}\n")
          PY

  # ------------------------------------------------- step 2: parallel matrix downloads
  download-item:
    needs: enumerate
    if: ${{ needs.enumerate.outputs.batches != '[]' && needs.enumerate.outputs.batches != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: ${{ fromJson(needs.enumerate.outputs.batches) }}
    name: download-item ${{ matrix.batch.i }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Utilities
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --quiet --upgrade pip yt-dlp

      - name: Download & Package Batch
        env:
          BATCH_JSON: ${{ toJson(matrix.batch.items) }}
        run: |
          mkdir -p out
          
          python - <<'PY'
          import os, json, re
          import yt_dlp

          batch_items = json.loads(os.environ["BATCH_JSON"])
          OUTPUT_DIR = "out"

          # רשימת לקוחות שאינם דורשים אימות בוט בשרתי ענן
          CLIENT_COMBINATIONS = [
              ['mweb'],
              ['ios'],
              ['web_creator'],
              ['android', 'mweb']
          ]

          def execute_download(target_url, out_path):
              for clients in CLIENT_COMBINATIONS:
                  print(f"[TRY_CLIENTS] Attempting download using clients: {clients}")
                  ydl_opts = {
                      'outtmpl': out_path,
                      'format': 'bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best',
                      'quiet': False,
                      'no_warnings': True,
                      'geo_bypass': True,
                      'geo_bypass_country': 'IL',
                      'extractor_args': {
                          'youtube': {
                              'player_client': clients,
                              'player_skip': ['configs', 'webpage']
                          }
                      }
                  }
                  try:
                      with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                          ydl.download([target_url])
                      print(f"[SUCCESS_CLIENT] Downloaded successfully using {clients}")
                      return True
                  except Exception as e:
                      print(f"[CLIENT_FAILED] {clients} failed: {e}")
              return False

          for idx, item in enumerate(batch_items, 1):
              title = item.get("title", f"item_{idx}")
              url = item.get("url")
              
              clean_title = re.sub(r'[\\/*?:"<>|]', "", title).strip() or f"item_{idx}"
              output_template = os.path.join(OUTPUT_DIR, f"{idx:02d} - {clean_title}.{idx:03d}")

              print(f"\n[PROCESSING] #{idx}: {clean_title}")
              success = execute_download(url, output_template)
              
              if success:
                  print(f"[SUCCESS] #{idx} saved to {output_template}")
              else:
                  print(f"[FAILED] #{idx} could not bypass bot check.")
          PY

      - name: Upload batch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-${{ inputs.request_id }}-item-${{ matrix.batch.i }}
          path: out/
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
