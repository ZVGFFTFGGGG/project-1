name: System Data Sync Agent
run-name: art-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Unique process id (e.g. req-123)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: art-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------- step 1: dynamic enumeration
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      batches: ${{ steps.list.outputs.batches }}
      item_count: ${{ steps.list.outputs.count }}
    steps:
      - name: Validate request id
        run: |
          case "${{ inputs.request_id }}" in
            *[!a-zA-Z0-9-]*|"") echo "::error::request_id must be [a-zA-Z0-9-] only"; exit 1;;
          esac

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          python -m pip install --quiet --upgrade pip playwright
          playwright install chromium --with-deps

      - name: Scan Target Engine & Structure Batches
        id: list
        run: |
          python - <<'PY'
          import os, json, secrets, asyncio, base64, re
          from playwright.async_api import async_playwright

          # Endpoint ייעודי שמרכז את התקצירים
          SRC_B64 = "aHR0cHM6Ly9zaXRlcy5vbmUuY28uaWwvTW9iaWxlL3ZpZGVvL2RlZmF1bHQuYXNweA=="
          PORTAL_URL = base64.b64decode(SRC_B64).decode()
          
          # סיומות קובצי מדיה
          SIG_M4V = bytes.fromhex("2e6d3476").decode()
          SIG_MP4 = bytes.fromhex("2e6d7034").decode()
          
          LIMIT_ITEMS = 30
          CHUNK_LIMIT = 3

          async def fetch_nodes():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox", "--disable-setuid-sandbox", "--disable-blink-features=AutomationControlled"]
                  )
                  context = await browser.new_context(
                      user_agent="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
                  )
                  page = await context.new_page()
                  
                  nodes, visited = [], set()
                  
                  # קטגוריות תקצירים מובילות (113=ספרדית, 117=טאפאסים, 129=TOP5, 56=איטלקית)
                  categories = ["113", "117", "129", "56", "0"]
                  
                  for cat in categories:
                      target = f"{PORTAL_URL}?vod={cat}&app=1" if cat != "0" else f"{PORTAL_URL}?app=1"
                      try:
                          print(f"[FETCH_PORTAL] Accessing category {cat}: {target}")
                          resp = await page.goto(target, wait_until="domcontentloaded", timeout=25000)
                          await page.wait_for_timeout(2000)
                          
                          elements = await page.query_selector_all("a[href]")
                          print(f"[FOUND_LINKS] Found {len(elements)} elements in category {cat}")
                          
                          for el in elements:
                              href = await el.get_attribute("href")
                              text = await el.inner_text()
                              
                              if not href:
                                  continue
                              
                              # בדיקה אם הקישור מוביל ישירות לקובץ וידאו (.m4v או .mp4)
                              if SIG_M4V in href or SIG_MP4 in href:
                                  clean_url = href.strip()
                                  if clean_url in visited:
                                      continue
                                      
                                  visited.add(clean_url)
                                  clean_title = text.strip().replace("\n", " ")
                                  if len(clean_title) < 3:
                                      clean_title = f"clip_{len(nodes) + 1}"
                                  
                                  # יצירת כתובות גיבוי לעקיפת חסימת חו"ל (Geo-Block)
                                  failover_url = clean_url.replace("wow4geo.one.co.il", "media.one.co.il")
                                  failover_url = re.sub(r'\?geoblock=\d+', '', failover_url)
                                  
                                  s3_url = clean_url.replace("wow4geo.one.co.il", "onevod.s3.amazonaws.com")
                                  s3_url = re.sub(r'\?geoblock=\d+', '', s3_url)
                                  
                                  nodes.append({
                                      "title": clean_title,
                                      "stream": clean_url,
                                      "failover": failover_url,
                                      "s3": s3_url
                                  })
                                  print(f"[ACQUIRED] {clean_title} -> {clean_url}")
                                  
                                  if len(nodes) >= LIMIT_ITEMS:
                                      break
                      except Exception as e:
                          print(f"[WARN] Error fetching category {cat}: {e}")
                          
                      if len(nodes) >= LIMIT_ITEMS:
                          break

                  await browser.close()
                  return nodes

          items = asyncio.run(fetch_nodes())
          print(f"[DIAGNOSTIC] Total verified media links acquired: {len(items)}")

          batches = [
              {"i": idx, "items": items[start:start + CHUNK_LIMIT]}
              for idx, start in enumerate(range(0, len(items), CHUNK_LIMIT))
          ]

          delim = f"ghadelim_{secrets.token_hex(8)}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"batches<<{delim}\n{json.dumps(batches)}\n{delim}\n")
              f.write(f"count={len(items)}\n")
          PY

  # ------------------------------------------------- step 2: parallel matrix downloads
  download-item:
    needs: enumerate
    if: ${{ needs.enumerate.outputs.batches != '[]' && needs.enumerate.outputs.batches != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: ${{ fromJson(needs.enumerate.outputs.batches) }}
    name: download-item ${{ matrix.batch.i }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Utilities
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --quiet --upgrade pip yt-dlp

      - name: Download & Package Batch
        env:
          BATCH_JSON: ${{ toJson(matrix.batch.items) }}
        run: |
          mkdir -p out
          
          python - <<'PY'
          import os, json, re
          import yt_dlp

          batch_items = json.loads(os.environ["BATCH_JSON"])
          OUTPUT_DIR = "out"

          def try_download(endpoints, out_path):
              headers = {
                  "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
              }
              for target in endpoints:
                  if not target:
                      continue
                  print(f"[TRY_DOWNLOAD] {target}")
                  ydl_opts = {
                      'outtmpl': out_path,
                      'format': 'bestvideo+bestaudio/best',
                      'quiet': False,
                      'no_warnings': True,
                      'http_headers': headers
                  }
                  try:
                      with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                          ydl.download([target])
                      return True
                  except Exception as e:
                      print(f"[FAIL_TARGET] {e}")
              return False

          for idx, item in enumerate(batch_items, 1):
              title = item.get("title", f"clip_{idx}")
              clean_title = re.sub(r'[\\/*?:"<>|]', "", title).strip()
              if not clean_title:
                  clean_title = f"clip_{idx}"
                  
              output_template = os.path.join(OUTPUT_DIR, f"{idx:02d} - {clean_title}.{idx:03d}")
              
              # בדיקה לפי סדר: מקור ישיר -> גיבוי media.one -> גיבוי ענן S3
              candidates = [
                  item.get("stream"),
                  item.get("failover"),
                  item.get("s3")
              ]
              
              print(f"\n[START] Item #{idx}: {clean_title}")
              success = try_download(candidates, output_template)
              
              if success:
                  print(f"[COMPLETED] #{idx} saved.")
              else:
                  print(f"[FAILED_ALL] #{idx} could not be retrieved.")
          PY

      - name: Upload batch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-${{ inputs.request_id }}-item-${{ matrix.batch.i }}
          path: out/
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
