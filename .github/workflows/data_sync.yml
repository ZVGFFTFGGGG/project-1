name: System Data Sync Agent
run-name: art-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Unique process id (e.g. req-123)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: art-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------- step 1: dynamic enumeration
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      batches: ${{ steps.list.outputs.batches }}
      item_count: ${{ steps.list.outputs.count }}
    steps:
      - name: Validate request id
        run: |
          case "${{ inputs.request_id }}" in
            *[!a-zA-Z0-9-]*|"") echo "::error::request_id must be [a-zA-Z0-9-] only"; exit 1;;
          esac

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          python -m pip install --quiet --upgrade pip playwright yt-dlp
          playwright install chromium --with-deps

      - name: Scan Target Engine & Structure Batches
        id: list
        run: |
          python - <<'PY'
          import os, json, secrets, asyncio, base64, re
          from playwright.async_api import async_playwright

          DOMAIN_B64 = "aHR0cHM6Ly93d3cub25lLmNvLmls"
          BASE_URL = base64.b64decode(DOMAIN_B64).decode()
          
          # נתיב הממשק הפנימי של התקצירים
          API_PATH_B64 = "L0NhdC9WaWRlby9EZWZhdWx0LmFzcHgvR2V0VmlkZW9z"
          API_PATH = base64.b64decode(API_PATH_B64).decode()
          
          LIMIT_ITEMS = 50
          CHUNK_LIMIT = 4

          async def fetch_nodes():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox", "--disable-setuid-sandbox", "--disable-blink-features=AutomationControlled"]
                  )
                  context = await browser.new_context(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
                  )
                  page = await context.new_page()
                  
                  nodes, visited = [], set()
                  
                  # קטגוריות מרכזיות: כללי (-2147483648), ראשיות (113, 56, 117)
                  categories = ["-2147483648", "113", "56"]
                  
                  for cat in categories:
                      for page_idx in range(1, 3):
                          query_url = f"{BASE_URL}{API_PATH}?vod={cat}&page={page_idx}"
                          try:
                              print(f"[DISCOVERY] Fetching category {cat} page {page_idx}...")
                              resp = await context.request.get(query_url, headers={
                                  "Referer": f"{BASE_URL}/",
                                  "X-Requested-With": "XMLHttpRequest"
                              })
                              
                              if resp.status != 200:
                                  print(f"[WARN] Non-200 status: {resp.status}")
                                  continue
                                  
                              raw = await resp.json()
                              data_str = raw.get("d", "{}")
                              parsed_d = json.loads(data_str) if isinstance(data_str, str) else data_str
                              
                              items_raw = parsed_d.get("Items", [])
                              items_list = json.loads(items_raw) if isinstance(items_raw, str) else items_raw
                              
                              for item in items_list:
                                  item_id = item.get("ID")
                                  if not item_id or item_id in visited:
                                      continue
                                      
                                  visited.add(item_id)
                                  title = item.get("Title", f"item_{item_id}").strip()
                                  stream_hd = item.get("URLStreamHD") or ""
                                  stream_sd = item.get("URLStreamSD") or ""
                                  stream_backup = item.get("URLStreamFailover") or ""
                                  
                                  if stream_hd or stream_backup or stream_sd:
                                      nodes.append({
                                          "id": item_id,
                                          "title": title,
                                          "stream": stream_hd,
                                          "failover": stream_backup,
                                          "sd": stream_sd
                                      })
                                      
                                  if len(nodes) >= LIMIT_ITEMS:
                                      break
                          except Exception as e:
                              print(f"[ERR] Scanning failed for {cat}: {e}")
                              
                          if len(nodes) >= LIMIT_ITEMS:
                              break
                      if len(nodes) >= LIMIT_ITEMS:
                          break

                  await browser.close()
                  return nodes

          items = asyncio.run(fetch_nodes())
          print(f"[DIAGNOSTIC] Total verified media nodes located: {len(items)}")
          
          if items:
              print(f"[SAMPLE] First item: {items[0]['title']} -> {items[0]['stream'] or items[0]['failover']}")

          batches = [
              {"i": idx, "items": items[start:start + CHUNK_LIMIT]}
              for idx, start in enumerate(range(0, len(items), CHUNK_LIMIT))
          ]

          delim = f"ghadelim_{secrets.token_hex(8)}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"batches<<{delim}\n{json.dumps(batches)}\n{delim}\n")
              f.write(f"count={len(items)}\n")
          PY

  # ------------------------------------------------- step 2: parallel matrix downloads
  download-item:
    needs: enumerate
    if: ${{ needs.enumerate.outputs.batches != '[]' && needs.enumerate.outputs.batches != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: ${{ fromJson(needs.enumerate.outputs.batches) }}
    name: download-item ${{ matrix.batch.i }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Utilities
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --quiet --upgrade pip yt-dlp

      - name: Download & Package Batch
        env:
          BATCH_JSON: ${{ toJson(matrix.batch.items) }}
        run: |
          mkdir -p out
          
          python - <<'PY'
          import os, json, re, base64
          import yt_dlp

          batch_items = json.loads(os.environ["BATCH_JSON"])
          OUTPUT_DIR = "out"
          DOMAIN_B64 = "aHR0cHM6Ly93d3cub25lLmNvLmls"
          BASE_URL = base64.b64decode(DOMAIN_B64).decode()

          def download_with_fallback(urls, out_path):
              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                  "Referer": f"{BASE_URL}/"
              }
              
              for endpoint in urls:
                  if not endpoint:
                      continue
                  print(f"[TRY_ENDPOINT] {endpoint}")
                  ydl_opts = {
                      'outtmpl': out_path,
                      'format': 'bestvideo+bestaudio/best',
                      'quiet': False,
                      'no_warnings': True,
                      'http_headers': headers
                  }
                  try:
                      with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                          ydl.download([endpoint])
                      # אם הקובץ ירד בהצלחה
                      return True
                  except Exception as e:
                      print(f"[ENDPOINT_FAIL] {e}")
              return False

          for idx, item in enumerate(batch_items, 1):
              title = item.get("title", f"item_{idx}")
              clean_title = re.sub(r'[\\/*?:"<>|]', "", title).strip()
              if not clean_title:
                  clean_title = f"item_{idx}"
                  
              output_template = os.path.join(OUTPUT_DIR, f"{idx:02d} - {clean_title}.{idx:03d}")
              
              # סדר עדיפויות להורדה: HD -> גיבוי ענן -> SD
              candidates = [
                  item.get("stream"),
                  item.get("failover"),
                  item.get("sd")
              ]
              
              print(f"\n[PROCESSING] #{idx} - {clean_title}")
              success = download_with_fallback(candidates, output_template)
              
              if success:
                  print(f"[SUCCESS] #{idx} downloaded.")
              else:
                  print(f"[FAILED] #{idx} could not be downloaded.")
          PY

      - name: Upload batch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-${{ inputs.request_id }}-item-${{ matrix.batch.i }}
          path: out/
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
