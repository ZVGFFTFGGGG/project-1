name: Sport5 Content Hub
run-name: sport5-hub-${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Target Category'
        required: true
        default: 'domestic_league'
        type: choice
        options:
          - 'domestic_league'    # תקצירי ליגת העל בכדורגל
          - 'european_league'    # תקצירי ליגת האלופות
          - 'latest_feed'        # כל התקצירים האחרונים
          - 'query_search'       # חיפוש קבוצה ספציפית
      query:
        description: 'Search Query (בשימוש רק אם נבחר query_search)'
        required: false
        default: 'מכבי תל אביב'
        type: string
      scope:
        description: 'מספר סרטונים להורדה'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
          - '10'
      action_type:
        description: 'מצב פעולה'
        required: true
        default: 'download'
        type: choice
        options:
          - 'download'           # הורדת הווידאו ויצירת Release
          - 'catalog_only'       # סריקה והצגת רשימת התקצירים בלבד
      quality:
        description: 'איכות וידאו'
        required: true
        default: '1080'
        type: choice
        options:
          - '1080'
          - '720'
          - '480'
          - 'best'
      proxy_url:
        description: 'שרת פרוקסי ישראלי (חובה אם מריצים על שרתי חו"ל של GitHub, למשל: http://user:pass@ip:port או socks5://...)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: sport5-hub-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      batches: ${{ steps.catalog.outputs.batches }}
      item_count: ${{ steps.catalog.outputs.count }}
    steps:
      - name: Free runner space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true

      - name: Set up Python tools
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade requests beautifulsoup4

      - name: Build targeted catalog
        id: catalog
        env:
          CATEGORY: ${{ inputs.category }}
          QUERY: ${{ inputs.query }}
          SCOPE: ${{ inputs.scope }}
          ACTION: ${{ inputs.action_type }}
          PROXY_URL: ${{ inputs.proxy_url }}
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, re, os, sys, html, json
          from bs4 import BeautifulSoup

          category = os.environ.get("CATEGORY", "domestic_league")
          raw_query = os.environ.get("QUERY", "").strip()
          max_items = int(os.environ.get("SCOPE", "3"))
          action_type = os.environ.get("ACTION", "download")
          proxy_url = os.environ.get("PROXY_URL", "").strip()

          tag_map = {
              "domestic_league": "https://www.sport5.co.il/tag/%D7%AA%D7%A7%D7%A6%D7%99%D7%A8%D7%99_%D7%9C%D7%99%D7%92%D7%AA_%D7%94%D7%A2%D7%9C",
              "european_league": "https://www.sport5.co.il/tag/%D7%AA%D7%A7%D7%A6%D7%99%D7%A8%D7%99_%D7%9C%D7%99%D7%92%D7%AA_%D7%94%D7%90%D7%9c%D7%95%D7%A4%D7%95%D7%AA",
              "latest_feed": "https://www.sport5.co.il/tag/%D7%AA%D7%A7%D7%A6%D7%99%D7%A8%D7%99%D7%9D"
          }

          aliases = {
              "barcelona": ["barcelona", "ברצלונה", "בארסה"],
              "real madrid": ["real madrid", "ריאל מדריד", "ריאל"],
              "maccabi": ["maccabi", "מכבי"],
              "haifa": ["haifa", "חיפה"],
              "tel aviv": ["tel aviv", "תל אביב"]
          }

          q_low = raw_query.lower()
          search_keys = [q_low]
          if q_low in aliases:
              search_keys.extend(aliases[q_low])

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept-Language": "he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7"
          }

          def get_opener():
              handlers = []
              if proxy_url:
                  handlers.append(urllib.request.ProxyHandler({'http': proxy_url, 'https': proxy_url}))
              return urllib.request.build_opener(*handlers)

          opener = get_opener()

          def clean_title(text):
              t = re.sub(r'<!\[CDATA\[(.*?)\]\]>', r'\1', text, flags=re.DOTALL)
              t = t.replace('<![CDATA[', '').replace(']]>', '')
              t = html.unescape(t).strip()
              t = re.sub(r'[\r\n\t]+', ' ', t)
              t = re.sub(r'[ /\\:*?"<>|]+', '_', t)
              return t.strip('_')[:80] or "video_item"

          def extract_link_title(a_tag):
              if a_tag.get("title"):
                  return a_tag["title"].strip()
              img = a_tag.find("img")
              if img and img.get("alt"):
                  return img["alt"].strip()
              h = a_tag.find(["h1", "h2", "h3", "h4"])
              if h and h.get_text(strip=True):
                  return h.get_text(strip=True)
              txt = a_tag.get_text(strip=True)
              return txt if txt else ""

          def extract_clean_stream(page_url):
              """Extract direct m3u8 stream using JSON-LD and robust regex fallbacks"""
              try:
                  req = urllib.request.Request(page_url, headers=headers)
                  with opener.open(req, timeout=12) as r:
                      page_html = r.read().decode("utf-8", errors="ignore")

                  # 1. JSON-LD structured data (highest accuracy)
                  soup = BeautifulSoup(page_html, "html.parser")
                  for script in soup.find_all("script", type="application/ld+json"):
                      try:
                          data = json.loads(script.string or "{}")
                          items = data if isinstance(data, list) else [data]
                          for item in items:
                              if item.get("@type") == "VideoObject":
                                  content_url = item.get("contentUrl", "")
                                  if "src=" in content_url:
                                      raw = urllib.parse.unquote(content_url.split("src=")[-1])
                                      clean = raw.split("&")[0].split("\\u0026")[0].strip()
                                      if ".m3u8" in clean:
                                          return clean.split(".m3u8")[0] + ".m3u8"
                      except Exception:
                          continue

                  # 2. watch.sport5.co.il player regex (handling both /?src= and ?src=)
                  match_watch = re.search(r'watch\.sport5\.co\.il/?\?src=([^"\'<>\s]+)', page_html)
                  if match_watch:
                      raw_src = urllib.parse.unquote(match_watch.group(1))
                      clean = raw_src.split("___")[0].split("\\u0026")[0].split("&")[0].strip()
                      if ".m3u8" in clean:
                          return clean.split(".m3u8")[0] + ".m3u8"

                  # 3. Akamai direct m3u8 search
                  matches = re.findall(r'(https?%3A%2F%2F[^\s"\'<>]+\.m3u8[^\s"\'<>]*|https?://[^\s"\'<>]+\.m3u8[^\s"\'<>]*)', page_html)
                  for stream in matches:
                      decoded = urllib.parse.unquote(stream)
                      if "src=" in decoded:
                          decoded = decoded.split("src=")[-1]
                      clean = decoded.split("___")[0].split("&")[0].strip()
                      if ".m3u8" in clean:
                          return clean.split(".m3u8")[0] + ".m3u8"
              except Exception as e:
                  print(f"Error checking {page_url}: {e}")
              return None

          candidates = []

          # 1. Scrape target tag repository
          target_url = tag_map.get(category, tag_map["latest_feed"])
          print(f"Scraping category repository: {target_url}")

          try:
              req = urllib.request.Request(target_url, headers=headers)
              with opener.open(req, timeout=12) as resp:
                  soup = BeautifulSoup(resp.read().decode("utf-8", errors="ignore"), "html.parser")
                  for a in soup.find_all("a", href=True):
                      h = a["href"]
                      if "articles.aspx" in h and "docID=" in h:
                          full_link = h if h.startswith("http") else f"https://www.sport5.co.il/{h.lstrip('/')}"
                          full_link = html.unescape(full_link)
                          raw_t = extract_link_title(a)
                          t = clean_title(raw_t)
                          if len(t) >= 4 and not any(full_link == c[0] for c in candidates):
                              candidates.append((full_link, t))
          except Exception as e:
              print(f"Repository note: {e}")

          # 2. Fallback to news sitemap if needed
          if len(candidates) < max_items:
              s_url = "https://www.sport5.co.il/sitemap/articles/news-sitemap.xml"
              try:
                  req = urllib.request.Request(s_url, headers=headers)
                  with opener.open(req, timeout=10) as resp:
                      content = resp.read().decode("utf-8", errors="ignore")
                      for block in re.findall(r'<url>(.*?)</url>', content, re.DOTALL):
                          loc_m = re.search(r'<loc>(.*?)</loc>', block)
                          title_m = re.search(r'<news:title>(.*?)</news:title>', block) or re.search(r'<title>(.*?)</title>', block)
                          if loc_m:
                              loc = html.unescape(loc_m.group(1).strip())
                              title = clean_title(html.unescape(title_m.group(1).strip()) if title_m else "")
                              if not any(loc == c[0] for c in candidates):
                                  candidates.append((loc, title))
              except Exception:
                  pass

          print(f"Collected {len(candidates)} candidate links.")

          resolved_items = []
          seen_streams = set()

          for loc, page_title in candidates:
              if len(resolved_items) >= max_items:
                  break

              t_low = page_title.lower()
              l_low = loc.lower()

              match = True
              if category == "query_search":
                  match = any(k in t_low or k in l_low for k in search_keys)

              if match:
                  stream = extract_clean_stream(loc)
                  if stream and stream not in seen_streams:
                      seen_streams.add(stream)
                      resolved_items.append({
                          "stream": stream,
                          "title": page_title,
                          "page": loc
                      })
                      print(f"[+] Found video highlight: {page_title[:50]}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"## Sport5 Catalog Summary\n\n")
              summary.write(f"- **Category:** `{category}`\n")
              summary.write(f"- **Total Highlights Located:** `{len(resolved_items)}`\n\n")
              summary.write("| # | Highlight Title | Direct Stream |\n")
              summary.write("| :--- | :--- | :--- |\n")
              for idx, it in enumerate(resolved_items, 1):
                  summary.write(f"| {idx} | `{it['title']}` | Ready |\n")

          if action_type == "catalog_only" or not resolved_items:
              batches = [{"id": 0, "items": []}]
          else:
              batch_size = 5
              batches = [
                  {"id": i + 1, "items": resolved_items[k:k + batch_size]}
                  for i, k in enumerate(range(0, len(resolved_items), batch_size))
              ]

          delim = "DELIM_" + os.urandom(8).hex()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"batches<<{delim}\n{json.dumps(batches)}\n{delim}\n")
              out.write(f"count={len(resolved_items)}\n")
          PY

  download-batch:
    needs: enumerate
    if: inputs.action_type == 'download' && fromJson(needs.enumerate.outputs.item_count) > 0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        batch: ${{ fromJson(needs.enumerate.outputs.batches) }}
    name: batch-${{ matrix.batch.id }}
    steps:
      - name: Check batch validity
        if: ${{ matrix.batch.id == 0 }}
        run: |
          echo "No active items in this batch. Exiting."
          exit 0

      - name: Free runner space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true

      - name: Set up Python tools
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade yt-dlp imageio-ffmpeg
          if command -v ffmpeg >/dev/null 2>&1; then
            FFMPEG_BIN=$(command -v ffmpeg)
          else
            FFMPEG_BIN=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
            chmod +x "$FFMPEG_BIN"
          fi
          echo "FFMPEG_BIN=$FFMPEG_BIN" >> "$GITHUB_ENV"

      - name: Download batch items
        env:
          BATCH_DATA: ${{ toJson(matrix.batch.items) }}
          QUALITY: ${{ inputs.quality }}
          PROXY_URL: ${{ inputs.proxy_url }}
        run: |
          mkdir -p out
          python - <<'PY'
          import json, os, subprocess

          data = json.loads(os.environ.get("BATCH_DATA", "[]"))
          quality = os.environ.get("QUALITY", "1080")
          proxy_url = os.environ.get("PROXY_URL", "").strip()
          ffmpeg_bin = os.environ.get("FFMPEG_BIN", "")

          if quality == "best":
              fmt_spec = "bv*+ba/b"
          else:
              fmt_spec = f"bv*[height<={quality}]+ba/b[height<={quality}]/bv*+ba/b"

          for it in data:
              stream_url = it["stream"]
              title = it["title"]
              out_path = f"out/{title}.%(ext)s"

              print(f"\n--- Downloading: {title} ({quality}p) ---")
              cmd = [
                  "yt-dlp",
                  "-f", fmt_spec,
                  "--merge-output-format", "mp4",
                  "--user-agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                  "--referer", "https://watch.sport5.co.il/",
                  "--no-playlist", "--no-progress", "--newline",
                  "--retries", "5", "--fragment-retries", "10",
                  "--ffmpeg-location", ffmpeg_bin,
                  "-o", out_path
              ]

              if proxy_url:
                  cmd.extend(["--proxy", proxy_url])

              cmd.extend(["--", stream_url])

              try:
                  subprocess.run(cmd, check=True)
              except Exception as e:
                  print(f"Download error on {title}: {e}")
          PY

      - name: Package batch to zip
        run: |
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "No downloaded media found."
            exit 0
          fi

          mkdir -p pack
          python - <<'PY'
          import os, zipfile

          out_dir = "out"
          pack_dir = "pack"
          batch_id = "${{ matrix.batch.id }}"

          files = [os.path.join(out_dir, f) for f in os.listdir(out_dir) if os.path.isfile(os.path.join(out_dir, f))]
          if files:
              zpath = os.path.join(pack_dir, f"sport5_batch_{int(batch_id):02d}.zip")
              with zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_DEFLATED) as zf:
                  for f in files:
                      zf.write(f, os.path.basename(f))
              print(f"Created package: {zpath}")
          PY

      - name: Upload batch packages to Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: hub-${{ github.run_id }}
        run: |
          if [ -z "$(ls -A pack/*.zip 2>/dev/null)" ]; then
            echo "No zip archives created to upload."
            exit 0
          fi

          gh release create "$TAG" --title "Sport5 - ${{ github.run_id }}" --notes "Automated download" 2>/dev/null || true

          for f in pack/*.zip; do
            if [ -f "$f" ]; then
              echo "Uploading $f..."
              gh release upload "$TAG" "$f" --clobber
            fi
          done
