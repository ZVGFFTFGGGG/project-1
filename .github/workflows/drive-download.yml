name: Scheduled Drive Queue Downloader

on:
  schedule:
    # בדיקה אוטומטית כל 25 דקות בענן
    - cron: '*/25 * * * *'
  workflow_dispatch:

concurrency:
  group: drive-queue-sync
  cancel-in-progress: false

jobs:
  check-and-download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno (n-challenge solver)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp cryptography

      - name: Configure Rclone (OAuth2 User)
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          client_id = $GDRIVE_CLIENT_ID
          client_secret = $GDRIVE_CLIENT_SECRET
          scope = drive
          token = {"refresh_token":"$GDRIVE_REFRESH_TOKEN","token_type":"Bearer"}
          root_folder_id = $GDRIVE_FOLDER_ID
          EOF

      - name: Check for Pending Requests in Google Drive
        id: check_queue
        run: |
          FILES=$(rclone lsf "gdrive:To-Download" --drive-export-formats txt 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "has_tasks=false" >> $GITHUB_OUTPUT
            echo "תיקיית To-Download ריקה."
          else
            echo "has_tasks=true" >> $GITHUB_OUTPUT
            echo "נמצאו משימות בתור:"
            echo "$FILES"
          fi

      - name: Decrypt Cookies (AES-256-GCM)
        if: steps.check_queue.outputs.has_tasks == 'true'
        env:
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
        run: |
          if [ -f "cookies.enc" ] && [ -n "$COOKIE_KEY" ]; then
            python - << 'EOF'
          import os, base64
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          key_str = os.environ.get("COOKIE_KEY", "").strip()
          try:
              key = bytes.fromhex(key_str)
          except ValueError:
              key = base64.b64decode(key_str)

          with open("cookies.enc", "rb") as f:
              data = f.read()

          nonce, ciphertext = data[:12], data[12:]
          aesgcm = AESGCM(key)
          decrypted = aesgcm.decrypt(nonce, ciphertext, None)

          with open("cookies.txt", "wb") as f:
              f.write(decrypted)
          print("Cookies decrypted successfully.")
          EOF
          fi

      - name: Process Queue and Download
        if: steps.check_queue.outputs.has_tasks == 'true'
        run: |
          mkdir -p ./local_queue downloads

          # הורדת קובצי הבקשה (המרת Google Docs ל-txt אוטומטית)
          rclone copy "gdrive:To-Download" ./local_queue --drive-export-formats txt

          # מחיקת הבקשות מתיקיית התור בדרייב
          rclone delete "gdrive:To-Download"

          # חילוץ קישורי יוטיוב
          URLS=$(grep -shoE 'https?://(www\.)?(youtube\.com|youtu\.be)/[^\s"'\''<>]+' ./local_queue/* 2>/dev/null | sort -u || true)

          if [ -z "$URLS" ]; then
            echo "לא נמצאו קישורי יוטיוב תקינים."
            exit 0
          fi

          COOKIE_ARG=""
          if [ -f "cookies.txt" ]; then
            COOKIE_ARG="--cookies cookies.txt"
          fi

          while IFS= read -r URL; do
            [ -z "$URL" ] && continue
            echo "מתחיל להוריד: $URL"
            
            yt-dlp \
              $COOKIE_ARG \
              --js-engine deno \
              -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4] / bv*+ba/b" \
              --merge-output-format mp4 \
              -o "downloads/%(title)s [%(id)s].%(ext)s" \
              --exec "rclone move {} gdrive:Completed/ --drive-chunk-size 64M -v && echo 'הועלה בהצלחה: {}'" \
              "$URL"
          done <<< "$URLS"

      - name: Cleanup Sensitive Data
        if: always()
        run: |
          rm -f cookies.txt
          rm -rf ~/.config/rclone downloads local_queue
