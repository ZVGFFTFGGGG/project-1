name: Download to Google Drive

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'קישור לסרטון / פלייליסט / ערוץ מיוטיוב'
        required: true
        type: string
  issues:
    types: [opened]

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract URL from Trigger
        id: get_url
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target_url=${{ github.event.inputs.url }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "issues" ]; then
            # שליפת קישור יוטיוב מתוך הכותרת או התוכן של ה-Issue
            URL=$(echo "${{ github.event.issue.title }} ${{ github.event.issue.body }}" | grep -oE 'https?://(www\.)?(youtube\.com|youtu\.be)/[^\s]+' | head -n 1)
            if [ -z "$URL" ]; then
              echo "לא נמצא קישור יוטיוב תקין ב-Issue."
              exit 1
            fi
            echo "target_url=$URL" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno (n-challenge solver for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Tools (yt-dlp, ffmpeg, rclone, cryptography)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp cryptography

      - name: Decrypt Cookies (AES-256-GCM)
        env:
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
        run: |
          if [ -f "cookies.enc" ] && [ -n "$COOKIE_KEY" ]; then
            python - << 'EOF'
          import os, base64
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          key_str = os.environ.get("COOKIE_KEY", "").strip()
          try:
              key = bytes.fromhex(key_str)
          except ValueError:
              key = base64.b64decode(key_str)

          with open("cookies.enc", "rb") as f:
              data = f.read()

          nonce, ciphertext = data[:12], data[12:]
          aesgcm = AESGCM(key)
          decrypted = aesgcm.decrypt(nonce, ciphertext, None)

          with open("cookies.txt", "wb") as f:
              f.write(decrypted)
          print("Cookies decrypted successfully.")
          EOF
          fi

      - name: Configure Rclone
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$GDRIVE_SA_KEY" > /tmp/sa_key.json

          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/sa_key.json
          root_folder_id = $GDRIVE_FOLDER_ID
          EOF

      - name: Download & Stream Direct to Google Drive
        env:
          TARGET_URL: ${{ steps.get_url.outputs.target_url }}
        run: |
          mkdir -p downloads

          COOKIE_ARG=""
          if [ -f "cookies.txt" ]; then
            COOKIE_ARG="--cookies cookies.txt"
          fi

          # כל קובץ שמסיים לרדת עולה ישירות לדרייב ונמחק מהדיסק מיד
          yt-dlp \
            $COOKIE_ARG \
            --js-engine deno \
            -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4] / bv*+ba/b" \
            --merge-output-format mp4 \
            -o "downloads/%(title)s [%(id)s].%(ext)s" \
            --exec "rclone move {} gdrive: --drive-chunk-size 64M -v && echo 'Uploaded and cleaned: {}'" \
            "$TARGET_URL"

      - name: Upload Any Remaining Files
        if: always()
        run: |
          if [ -d "downloads" ] && [ "$(ls -A downloads)" ]; then
            rclone move downloads/ gdrive: --drive-chunk-size 64M -v
          fi

      - name: Cleanup Sensitive Data
        if: always()
        run: |
          rm -f cookies.txt /tmp/sa_key.json
          rm -rf ~/.config/rclone downloads

      - name: Close Issue on Success
        if: github.event_name == 'issues' && success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ הסרטון/פלייליסט הועלה בהצלחה ישירות ל-Google Drive!'
            });
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
