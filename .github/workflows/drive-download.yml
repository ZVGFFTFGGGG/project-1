name: Scheduled Drive Queue Downloader

on:
  schedule:
    # מופעל אוטומטית כל 25 דקות, 24/7, בענן של גיטהאב
    - cron: '*/25 * * * *'
  workflow_dispatch: # מאפשר גם הפעלה ידנית מגיטהאב כשיש גישה

# מונע ריצות כפולות במקביל אם הורדה אחת לקחה יותר מ-25 דקות
concurrency:
  group: drive-queue-sync
  cancel-in-progress: false

jobs:
  check-and-download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno (n-challenge solver)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp cryptography

      - name: Configure Rclone
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$GDRIVE_SA_KEY" > /tmp/sa_key.json

          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/sa_key.json
          root_folder_id = $GDRIVE_FOLDER_ID
          EOF

      - name: Check for Pending Requests in Google Drive
        id: check_queue
        run: |
          # בדיקה האם קיימים קבצים בתיקיית To-Download (כולל ייצוא אוטומטי של Google Docs ל-txt)
          FILES=$(rclone lsf "gdrive:To-Download" --drive-export-formats txt 2>/dev/null || true)
          
          if [ -z "$FILES" ]; then
            echo "has_tasks=false" >> $GITHUB_OUTPUT
            echo "תיקיית To-Download ריקה. אין משימות לביצוע."
          else
            echo "has_tasks=true" >> $GITHUB_OUTPUT
            echo "נמצאו בקשות בתיקייה:"
            echo "$FILES"
          fi

      - name: Decrypt Cookies (AES-256-GCM)
        if: steps.check_queue.outputs.has_tasks == 'true'
        env:
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
        run: |
          if [ -f "cookies.enc" ] && [ -n "$COOKIE_KEY" ]; then
            python - << 'EOF'
          import os, base64
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          key_str = os.environ.get("COOKIE_KEY", "").strip()
          try:
              key = bytes.fromhex(key_str)
          except ValueError:
              key = base64.b64decode(key_str)

          with open("cookies.enc", "rb") as f:
              data = f.read()

          nonce, ciphertext = data[:12], data[12:]
          aesgcm = AESGCM(key)
          decrypted = aesgcm.decrypt(nonce, ciphertext, None)

          with open("cookies.txt", "wb") as f:
              f.write(decrypted)
          print("Cookies decrypted successfully.")
          EOF
          fi

      - name: Process Queue and Download
        if: steps.check_queue.outputs.has_tasks == 'true'
        run: |
          mkdir -p ./local_queue downloads

          # העתקת הבקשות מקומית תוך המרת Google Docs לקובצי טקסט רגילים
          rclone copy "gdrive:To-Download" ./local_queue --drive-export-formats txt

          # העברת עותק לתיקיית Archive בדרייב ומחיקה מ-To-Download
          rclone copy "gdrive:To-Download" "gdrive:Archive"
          rclone delete "gdrive:To-Download"

          # חילוץ כל קישורי היוטיוב מתוך כל הקבצים שירדו
          URLS=$(grep -shoE 'https?://(www\.)?(youtube\.com|youtu\.be)/[^\s"'\''<>]+' ./local_queue/* 2>/dev/null | sort -u || true)

          if [ -z "$URLS" ]; then
            echo "לא נמצאו קישורי יוטיוב תקינים בתוך הקבצים."
            exit 0
          fi

          COOKIE_ARG=""
          if [ -f "cookies.txt" ]; then
            COOKIE_ARG="--cookies cookies.txt"
          fi

          # עיבוד והורדת כל קישור ברשימה
          while IFS= read -r URL; do
            [ -z "$URL" ] && continue
            echo "=========================================="
            echo "מתחיל להוריד: $URL"
            echo "=========================================="
            
            # הורדה והעלאה ישירה ל-Completed (מחיקה מיידית מהדיסק של השרת)
            yt-dlp \
              $COOKIE_ARG \
              --js-engine deno \
              -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4] / bv*+ba/b" \
              --merge-output-format mp4 \
              -o "downloads/%(title)s [%(id)s].%(ext)s" \
              --exec "rclone move {} gdrive:Completed/ --drive-chunk-size 64M -v && echo 'הועלה ונמחק מהדיסק: {}'" \
              "$URL"
          done <<< "$URLS"

      - name: Cleanup Sensitive Data
        if: always()
        run: |
          rm -f cookies.txt /tmp/sa_key.json
          rm -rf ~/.config/rclone downloads local_queue
