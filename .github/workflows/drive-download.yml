name: Scheduled Drive Queue Downloader

on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:

concurrency:
  group: drive-queue-sync
  cancel-in-progress: false

jobs:
  diagnose-and-download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno (n-challenge solver)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp cryptography

      - name: Configure Rclone
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          client_id = $GDRIVE_CLIENT_ID
          client_secret = $GDRIVE_CLIENT_SECRET
          scope = drive
          token = {"refresh_token":"$GDRIVE_REFRESH_TOKEN","token_type":"Bearer"}
          root_folder_id = $GDRIVE_FOLDER_ID

          [entire_drive]
          type = drive
          client_id = $GDRIVE_CLIENT_ID
          client_secret = $GDRIVE_CLIENT_SECRET
          scope = drive
          token = {"refresh_token":"$GDRIVE_REFRESH_TOKEN","token_type":"Bearer"}
          EOF

      - name: Full Google Drive Diagnostic
        run: |
          echo "=================================================="
          echo "           דוח בדיקת מצב GOOGLE DRIVE            "
          echo "=================================================="
          
          echo "1. בדיקת תקשורת ואימות מול גוגל:"
          if rclone about entire_drive: 2>&1 | tee /tmp/quota.txt; then
            echo "-> החיבור לחשבון גוגל תקין ומאושר!"
          else
            echo "-> שגיאה: החיבור לגוגל נכשל. בדוק את ה-Secrets."
            exit 1
          fi
          
          echo ""
          echo "2. מה קיים בתוך ה-GDRIVE_FOLDER_ID שהגדרת:"
          echo "--- תיקיות משנה ---"
          rclone lsd gdrive: || echo "אין תיקיות משנה או שגיאה בגישה"
          echo "--- קבצים ---"
          rclone lsf gdrive: --drive-export-formats txt || echo "אין קבצים"
          
          echo ""
          echo "3. סריקה בתוך To-Download (אם קיימת):"
          rclone lsf "gdrive:To-Download" --drive-export-formats txt 2>/dev/null || echo "התיקייה To-Download לא נמצאה תחת ה-ID הזה"
          echo "=================================================="

      - name: Scan For Links and Download
        run: |
          mkdir -p ./local_queue downloads

          # סריקה כפולה: מוריד קבצים גם מהתיקייה הראשית וגם מ-To-Download
          rclone copy "gdrive:" ./local_queue --drive-export-formats txt --max-depth 2 --include "*.txt" --include "*.docx" 2>/dev/null || true
          rclone copy "gdrive:To-Download" ./local_queue --drive-export-formats txt 2>/dev/null || true

          # חילוץ כל קישורי היוטיוב מכל הקבצים שנמצאו
          URLS=$(grep -shoE 'https?://(www\.)?(youtube\.com|youtu\.be)/[^\s"'\''<>]+' ./local_queue/* 2>/dev/null | sort -u || true)

          if [ -z "$URLS" ]; then
            echo "לא נמצא שום קישור יוטיוב באף קובץ. ממתין לסבב הבא."
            exit 0
          fi

          echo "נמצאו קישורים להורדה:"
          echo "$URLS"

          # פענוח עוגיות במידה וקיימות
          if [ -f "cookies.enc" ] && [ -n "${{ secrets.COOKIE_KEY }}" ]; then
            python - << 'EOF'
          import os, base64
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          key_str = os.environ.get("COOKIE_KEY", "").strip()
          try:
              key = bytes.fromhex(key_str)
          except ValueError:
              key = base64.b64decode(key_str)
          with open("cookies.enc", "rb") as f:
              data = f.read()
          nonce, ciphertext = data[:12], data[12:]
          aesgcm = AESGCM(key)
          decrypted = aesgcm.decrypt(nonce, ciphertext, None)
          with open("cookies.txt", "wb") as f:
              f.write(decrypted)
          EOF
          fi

          COOKIE_ARG=""
          [ -f "cookies.txt" ] && COOKIE_ARG="--cookies cookies.txt"

          # מחיקת קובצי הבקשה כדי שלא יירדו שוב
          rclone delete "gdrive:To-Download" 2>/dev/null || true

          # הורדה והעלאה ישירה ל-Completed
          while IFS= read -r URL; do
            [ -z "$URL" ] && continue
            echo "מוריד כעת: $URL"
            yt-dlp \
              $COOKIE_ARG \
              --js-engine deno \
              -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4] / bv*+ba/b" \
              --merge-output-format mp4 \
              -o "downloads/%(title)s [%(id)s].%(ext)s" \
              --exec "rclone move {} gdrive:Completed/ --drive-chunk-size 64M -v && echo 'הועלה בהצלחה: {}'" \
              "$URL"
          done <<< "$URLS"

      - name: Cleanup
        if: always()
        run: |
          rm -f cookies.txt
          rm -rf ~/.config/rclone downloads local_queue
