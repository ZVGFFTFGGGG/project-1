name: Scheduled Drive Queue Downloader

on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:

concurrency:
  group: drive-queue-sync
  cancel-in-progress: false

jobs:
  run-download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python & Deno
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone jq
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp cryptography

      - name: Authenticate and Configure Rclone
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          # משיכת access_token חי מגוגל ישירות דרך ה-API
          TOKEN_RES=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=$GDRIVE_CLIENT_ID" \
            -d "client_secret=$GDRIVE_CLIENT_SECRET" \
            -d "refresh_token=$GDRIVE_REFRESH_TOKEN" \
            -d "grant_type=refresh_token")

          ACCESS_TOKEN=$(echo "$TOKEN_RES" | jq -r '.access_token // empty')

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "שגיאת אימות מול גוגל:"
            echo "$TOKEN_RES"
            exit 1
          fi

          echo "האימות עבר בהצלחה!"
          mkdir -p ~/.config/rclone

          # יצירת קובץ הגדרות מושלם ש-rclone מקבל
          TOKEN_JSON="{\"access_token\":\"$ACCESS_TOKEN\",\"token_type\":\"Bearer\",\"refresh_token\":\"$GDRIVE_REFRESH_TOKEN\",\"expiry\":\"2035-01-01T00:00:00Z\"}"

          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          client_id = $GDRIVE_CLIENT_ID
          client_secret = $GDRIVE_CLIENT_SECRET
          scope = drive
          token = $TOKEN_JSON
          root_folder_id = $GDRIVE_FOLDER_ID
          EOF

      - name: Scan and Download
        run: |
          mkdir -p ./local_queue downloads

          # סריקת כל הקבצים שבתיקייה הראשית ובתיקיות המשנה
          rclone copy "gdrive:" ./local_queue --drive-export-formats txt --max-depth 2 2>/dev/null || true

          # חילוץ קישורי יוטיוב
          URLS=$(grep -shoE 'https?://(www\.)?(youtube\.com|youtu\.be)/[^\s"'\''<>]+' ./local_queue/* 2>/dev/null | sort -u || true)

          if [ -z "$URLS" ]; then
            echo "לא נמצאו קישורי יוטיוב להורדה. מסתיים בהצלחה."
            exit 0
          fi

          echo "נמצאו קישורים:"
          echo "$URLS"

          # פענוח עוגיות
          if [ -f "cookies.enc" ] && [ -n "${{ secrets.COOKIE_KEY }}" ]; then
            python - << 'EOF'
          import os, base64
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          key_str = os.environ.get("COOKIE_KEY", "").strip()
          try:
              key = bytes.fromhex(key_str)
          except ValueError:
              key = base64.b64decode(key_str)
          with open("cookies.enc", "rb") as f:
              data = f.read()
          nonce, ciphertext = data[:12], data[12:]
          aesgcm = AESGCM(key)
          decrypted = aesgcm.decrypt(nonce, ciphertext, None)
          with open("cookies.txt", "wb") as f:
              f.write(decrypted)
          EOF
          fi

          COOKIE_ARG=""
          [ -f "cookies.txt" ] && COOKIE_ARG="--cookies cookies.txt"

          # מחיקת קובצי הבקשה כדי שלא יורדו שוב
          rclone delete "gdrive:To-Download" 2>/dev/null || true

          # הורדה והעלאה ישירה ל-Completed
          while IFS= read -r URL; do
            [ -z "$URL" ] && continue
            echo "מוריד: $URL"
            yt-dlp \
              $COOKIE_ARG \
              --js-engine deno \
              -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4] / bv*+ba/b" \
              --merge-output-format mp4 \
              -o "downloads/%(title)s [%(id)s].%(ext)s" \
              --exec "rclone move {} gdrive:Completed/ --drive-chunk-size 64M -v && echo 'הועלה בהצלחה: {}'" \
              "$URL"
          done <<< "$URLS"

      - name: Cleanup
        if: always()
        run: rm -rf cookies.txt ~/.config/rclone downloads local_queue
