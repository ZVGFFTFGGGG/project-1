name: Scheduled Drive Queue Downloader

on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:

concurrency:
  group: drive-queue-sync
  cancel-in-progress: false

jobs:
  run-download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python & Deno
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone jq
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp cryptography

      - name: Authenticate and Configure Rclone
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          # משיכת access_token חי מגוגל ישירות דרך ה-API
          TOKEN_RES=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=$GDRIVE_CLIENT_ID" \
            -d "client_secret=$GDRIVE_CLIENT_SECRET" \
            -d "refresh_token=$GDRIVE_REFRESH_TOKEN" \
            -d "grant_type=refresh_token")

          ACCESS_TOKEN=$(echo "$TOKEN_RES" | jq -r '.access_token // empty')

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "שגיאת אימות מול גוגל:"
            echo "$TOKEN_RES"
            exit 1
          fi

          echo "האימות עבר בהצלחה!"
          mkdir -p ~/.config/rclone

          # יצירת קובץ הגדרות מושלם ש-rclone מקבל
          TOKEN_JSON="{\"access_token\":\"$ACCESS_TOKEN\",\"token_type\":\"Bearer\",\"refresh_token\":\"$GDRIVE_REFRESH_TOKEN\",\"expiry\":\"2035-01-01T00:00:00Z\"}"

          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          client_id = $GDRIVE_CLIENT_ID
          client_secret = $GDRIVE_CLIENT_SECRET
          scope = drive
          token = $TOKEN_JSON
          root_folder_id = $GDRIVE_FOLDER_ID
          EOF

      - name: Scan and Download
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          mkdir -p ./local_queue downloads

          echo "=== בדיקת קבצים בדרייב ==="
          rclone ls "gdrive:" || true

          # שמירת העוגיות מתוך ה-Secret לקובץ זמני
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > /tmp/cookies.txt
            COOKIE_ARG="--cookies /tmp/cookies.txt"
            echo "עוגיות נטענו בהצלחה!"
          fi

          # הורדת קובצי הבקשות
          rclone copy "gdrive:" ./local_queue --drive-export-formats txt --max-depth 2

          # חילוץ הקישורים
          python - << 'EOF'
          import os, re, zipfile

          urls = set()
          for root, _, files in os.walk('./local_queue'):
              for f in files:
                  path = os.path.join(root, f)
                  text = ""
                  if f.endswith('.docx'):
                      try:
                          with zipfile.ZipFile(path) as z:
                              text = z.read('word/document.xml').decode('utf-8', errors='ignore')
                      except: pass
                  if not text:
                      try:
                          with open(path, 'r', errors='ignore') as fp:
                              text = fp.read()
                      except: pass

                  found = re.findall(r'https?://(?:www\.)?(?:youtube\.com|youtu\.be)/[^\s"\'<>]+', text)
                  urls.update(found)

          with open('urls_to_download.txt', 'w') as out:
              for u in sorted(urls):
                  out.write(u + '\n')
          EOF

          if [ ! -s "urls_to_download.txt" ]; then
            echo "לא נמצא שום קישור יוטיוב בקבצים."
            exit 0
          fi

          echo "קישורים שנמצאו לעיבוד:"
          cat urls_to_download.txt

          # מחיקת קובצי הבקשה מהדרייב
          rclone delete "gdrive:To-Download" 2>/dev/null || true
          rclone delete "gdrive:" --include "*.docx" --include "*.txt" 2>/dev/null || true

          # הורדה והעלאה לדרייב
          # הורדה והעלאה ישירה ל-Completed
                    while IFS= read -r URL; do
                      [ -z "$URL" ] && continue
                      echo "מוריד כעת: $URL"
                      yt-dlp \
                        $COOKIE_ARG \
                        --remote-components ejs:github \
                        -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4] / bv*+ba/b" \
                        --merge-output-format mp4 \
                        -o "downloads/%(title)s [%(id)s].%(ext)s" \
                        --exec "rclone move {} gdrive:Completed/ --drive-chunk-size 64M -v && echo 'הועלה בהצלחה: {}'" \
                        "$URL"
                    done < urls_to_download.txt
