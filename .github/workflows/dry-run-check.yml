name: index-check
run-name: check-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Execution ID'
        required: true
        type: string
        default: 'run-01'
      url:
        description: 'Source URL'
        required: true
        type: string
      target_count:
        description: 'Target item count'
        required: false
        default: '1500'
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate request ID
        run: |
          case "${{ inputs.request_id }}" in
            *[!a-zA-Z0-9-]*|"") echo "::error::Request ID must contain letters and numbers only"; exit 1;;
          esac

      - name: Checkout local repository data
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip yt-dlp

      - name: Execute data index check
        env:
          TARGET_URL: ${{ inputs.url }}
          TARGET_COUNT: ${{ inputs.target_count }}
        run: |
          python - <<'PY'
          import os, re, sys
          import yt_dlp

          TARGET_URL = os.environ["TARGET_URL"]
          try:
              MAX_ITEMS = int(os.environ.get("TARGET_COUNT", "1500").strip())
          except Exception:
              MAX_ITEMS = 1500

          # 1. Read existing IDs from file
          completed_ids = set()
          if os.path.exists("completed.txt"):
              with open("completed.txt", "r", encoding="utf-8") as f:
                  completed_ids = {line.strip() for line in f if line.strip() and len(line.strip()) == 11}

          # 2. Resolve source playlist ID without pulling titles or metadata
          init_opts = {
              "extract_flat": True,
              "quiet": True,
              "no_warnings": True,
              "skip_download": True,
              "playlistend": 1,
          }

          with yt_dlp.YoutubeDL(init_opts) as ydl:
              meta = ydl.extract_info(TARGET_URL, download=False) or {}

          source_id = meta.get("channel_id") or ""
          if not (source_id.startswith("UC") and len(source_id) == 24):
              cid = meta.get("id") or ""
              if cid.startswith("UC") and len(cid) == 24:
                  source_id = cid
          if not source_id:
              m = re.search(r'UC[a-zA-Z0-9_-]{22}', str(meta))
              if m:
                  source_id = m.group(0)

          if source_id and source_id.startswith("UC"):
              full_source_url = f"https://www.youtube.com/playlist?list=UU{source_id[2:]}"
          else:
              full_source_url = TARGET_URL

          # 3. Flat scan of alphanumeric IDs only
          scan_opts = {
              "extract_flat": True,
              "quiet": True,
              "no_warnings": True,
              "skip_download": True,
          }

          found_ids = []
          total_scanned = 0
          skipped_count = 0
          seen = set()

          with yt_dlp.YoutubeDL(scan_opts) as ydl:
              res = ydl.extract_info(full_source_url, download=False) or {}

          entries = res.get("entries") or []
          for e in entries:
              if not e:
                  continue
              total_scanned += 1
              entry_id = e.get("id")

              if not entry_id or entry_id in seen:
                  continue

              seen.add(entry_id)

              if entry_id in completed_ids:
                  skipped_count += 1
                  continue

              found_ids.append(entry_id)

              if len(found_ids) >= MAX_ITEMS:
                  break

          # 4. Generate clean technical report (numbers and standard terms only)
          report = []
          report.append("=========================================")
          report.append("       TECHNICAL DATA METRICS REPORT     ")
          report.append("=========================================")
          report.append("Status: Connected")
          report.append(f"Existing records in file: {len(completed_ids)}")
          report.append(f"Total items scanned sequentially: {total_scanned}")
          report.append(f"Previously indexed items (skipped): {skipped_count}")
          report.append(f"New items ready for processing: {len(found_ids)}")
          report.append(f"Target threshold: {MAX_ITEMS}")
          report.append("-----------------------------------------")
          if len(found_ids) >= MAX_ITEMS:
              report.append(f"Result: SUCCESS - Target of {len(found_ids)} new items reached.")
          else:
              report.append(f"Result: COMPLETED - Total of {len(found_ids)} new items discovered.")
          report.append("=========================================")

          output_text = "\n".join(report)
          print(output_text)

          # Write summary to GitHub Step Summary
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("### Technical Metrics Summary\n\n")
                  f.write("- **Connection Status:** OK\n")
                  f.write(f"- **Existing records in file:** {len(completed_ids):,}\n")
                  f.write(f"- **Total items scanned:** {total_scanned:,}\n")
                  f.write(f"- **Previously processed (skipped):** {skipped_count:,}\n")
                  f.write(f"- **New items identified:** {len(found_ids):,}\n")
                  f.write(f"- **Target threshold:** {MAX_ITEMS:,}\n")
          PY
