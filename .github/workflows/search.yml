name: YouTube Search Proxy

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'מילת חיפוש'
        required: true
        type: string
      max_results:
        description: 'כמות תוצאות מקסימלית'
        required: false
        default: '15'
        type: string

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp
        run: |
          pip install yt-dlp

      - name: Execute Search
        env:
          QUERY: ${{ inputs.query }}
          MAX_RESULTS: ${{ inputs.max_results }}
        run: |
          cat << 'EOF' > search_script.py
          import json
          import subprocess
          import os

          query = os.environ.get("QUERY", "")
          max_results = os.environ.get("MAX_RESULTS", "15")

          cmd = [
              "yt-dlp",
              f"ytsearch{max_results}:{query}",
              "--dump-json",
              "--flat-playlist",
              "--no-warnings"
          ]

          proc = subprocess.run(cmd, capture_output=True, text=True)
          
          markdown_lines = [f"# תוצאות חיפוש עבור: {query}\n"]
          results_list = []

          for i, line in enumerate(proc.stdout.strip().split("\n"), 1):
              if not line:
                  continue
              try:
                  data = json.loads(line)
                  video_id = data.get("id")
                  title = data.get("title")
                  duration = data.get("duration")
                  channel = data.get("uploader") or data.get("channel") or "ערוץ לא ידוע"
                  url = f"https://www.youtube.com/watch?v={video_id}"

                  dur_str = ""
                  if duration:
                      m, s = divmod(int(duration), 60)
                      h, m = divmod(m, 60)
                      dur_str = f" [{h}:{m:02d}:{s:02d}]" if h else f" [{m:02d}:{s:02d}]"

                  markdown_lines.append(f"{i}. **{title}**{dur_str} - *{channel}*")
                  markdown_lines.append(f"   קישור: `{url}`\n")
              except Exception:
                  continue

          with open("notes.md", "w", encoding="utf-8") as f:
              f.write("\n".join(markdown_lines))
          EOF

          python search_script.py

      - name: Publish Release with Results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUERY: ${{ inputs.query }}
        run: |
          TAG="search-$(date +%s)"
          gh release create "$TAG" --title "חיפוש: ${QUERY}" --notes-file notes.md

      - name: Cleanup Old Search Releases
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 50 | grep "search-" | tail -n +6 | awk '{print $1}' | while read -r tag; do
            gh release delete "$tag" --yes || true
          done
