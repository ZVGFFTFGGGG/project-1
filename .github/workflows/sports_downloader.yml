name: Sports Video Downloader
run-name: sports-${{ inputs.request_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'שם/מזהה להורדה (יופיע בשם ה-Release)'
        required: true
        default: 'sports-pack'
        type: string
      url:
        description: 'קישור למשחק/תקציר (וואן / ספורט 5 / צרלטון / וואלה / אתר משחקים)'
        required: true
        type: string
      quality:
        description: 'איכות וידאו'
        required: false
        default: '1080'
        type: choice
        options:
          - 'best'
          - '1080'
          - '720'
          - '480'

permissions:
  contents: write

concurrency:
  group: sports-${{ inputs.request_id || github.run_id }}
  cancel-in-progress: false

jobs:
  download-and-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true

      - name: Set up Python & Tools
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade yt-dlp imageio-ffmpeg curl_cffi
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download Video via yt-dlp
        env:
          TARGET_URL: ${{ inputs.url }}
          QUALITY: ${{ inputs.quality }}
        run: |
          mkdir -p out

          # הגדרת איכות מותאמת
          case "$QUALITY" in
            1080) FMT_ARGS="-f bv*[height<=1080]+ba/b[height<=1080]/bv*+ba/b --merge-output-format mp4" ;;
            720)  FMT_ARGS="-f bv*[height<=720]+ba/b[height<=720]/bv*+ba/b --merge-output-format mp4" ;;
            480)  FMT_ARGS="-f bv*[height<=480]+ba/b[height<=480]/bv*+ba/b --merge-output-format mp4" ;;
            *)    FMT_ARGS="-f bv*+ba/b --merge-output-format mp4" ;;
          esac

          echo "Starting download for: $TARGET_URL"

          # yt-dlp עם התאמות מיוחדות לדפדפנים ואתרי ספורט ישראליים
          yt-dlp \
            $FMT_ARGS \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --referer "https://www.google.com/" \
            --no-check-certificates \
            --no-playlist \
            --retries 10 \
            --fragment-retries 15 \
            --embed-metadata \
            -o "out/%(title).100B [%(id)s].%(ext)s" \
            -- "$TARGET_URL" || {
              echo "Standard download failed, attempting generic HLS extraction..."
              yt-dlp --generic-extract-all -o "out/%(title).100B [%(id)s].%(ext)s" -- "$TARGET_URL"
            }

      - name: Verify Downloaded Files
        run: |
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "::error::No files were downloaded. The video link might be protected or unsupported."
            exit 1
          fi
          echo "Downloaded files:"
          ls -lh out

      - name: Split and Package (Netfree Friendly, max 1.8GB)
        env:
          TAG: sports-${{ inputs.request_id || github.run_id }}
        run: |
          mkdir -p pack
          python - <<'PY'
          import os, re, sys, zipfile

          out_dir = "out"
          pack_dir = "pack"
          MAX_SIZE = int(1.8 * 1024 * 1024 * 1024) # מקסימום 1.8GB לקובץ

          # 1. בדיקה אם קובץ יחיד עולה על 1.8GB ופיצולו
          for root, _, fnames in os.walk(out_dir):
              for f in fnames:
                  full = os.path.join(root, f)
                  if os.path.getsize(full) > MAX_SIZE:
                      part = 1
                      chunks = []
                      with open(full, "rb") as src:
                          while True:
                              data = src.read(MAX_SIZE)
                              if not data:
                                  break
                              cpath = f"{full}.{part:03d}"
                              with open(cpath, "wb") as dst:
                                  dst.write(data)
                              chunks.append(cpath)
                              part += 1
                      os.remove(full)
                      # יצירת קובץ איחוד בלחיצה למחשב
                      bat_path = os.path.splitext(full)[0] + "_JOIN.bat"
                      parts_str = " + ".join([f'"{os.path.basename(c)}"' for c in chunks])
                      with open(bat_path, "w", encoding="utf-8") as bat:
                          bat.write(f'@echo off\ncopy /b {parts_str} "{f}"\necho Joined successfully!\npause\n')

          # 2. איסוף כל הקבצים וסידורם
          all_files = []
          for root, _, fnames in os.walk(out_dir):
              for f in fnames:
                  full = os.path.join(root, f)
                  rel = os.path.relpath(full, out_dir)
                  all_files.append((full, rel, os.path.getsize(full)))
          all_files.sort(key=lambda x: x[1])

          # 3. יצירת ארכיוני ZIP בגודל תקני
          base_name = "Sports_Video"
          if all_files:
              raw_first = os.path.splitext(os.path.basename(all_files[0][0]))[0]
              base_name = re.sub(r'[ /\\:*?"<>|]+', "_", raw_first)[:60] or "Sports_Video"

          total_sz = sum(f[2] for f in all_files)
          if total_sz <= MAX_SIZE:
              zpath = os.path.join(pack_dir, f"{base_name}.zip")
              with zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_STORED) as zf:
                  for full, rel, _ in all_files:
                      zf.write(full, rel)
          else:
              sub = 1
              cur_sz = 0
              zf = None
              for full, rel, sz in all_files:
                  if zf is None or (cur_sz + sz > MAX_SIZE and cur_sz > 0):
                      if zf:
                          zf.close()
                      zpath = os.path.join(pack_dir, f"{base_name}_part{sub:02d}.zip")
                      zf = zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_STORED)
                      sub += 1
                      cur_sz = 0
                  zf.write(full, rel)
                  cur_sz += sz
              if zf:
                  zf.close()
          PY

      - name: Publish Release to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: sports-${{ inputs.request_id || github.run_id }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --title "$TAG" --notes "Sports Download for Netfree"

          while IFS= read -r -d '' f; do
            esc=$(printf '%s' "$f" | sed 's/[][*?\\]/\\&/g')
            for attempt in 1 2 3 4 5; do
              echo "Uploading $f (attempt $attempt)..."
              if gh release upload "$TAG" "$esc" --clobber; then
                echo "Uploaded $f successfully!"
                break
              fi
              sleep 5
            done
          done < <(find pack -name "*.zip" -type f -print0)
