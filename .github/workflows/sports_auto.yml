name: Sports Auto Downloader
run-name: ⚽ ${{ inputs.mode == 'search' && inputs.query || inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'בחר מצב פעולה'
        required: true
        default: 'search'
        type: choice
        options:
          - 'search'         # חיפוש חופשי לפי שם קבוצה/משחק
          - 'latest_all'     # התקצירים האחרונים מכל הערוצים (ספורט 5 + ONE)
          - 'latest_sport5'  # התקצירים האחרונים מערוץ הספורט בלבד
          - 'latest_one'     # התקצירים האחרונים מ-ONE בלבד (ספרדית/איטלקית)
          - 'direct_url'     # הדבקת קישור ישיר (אם יש לך)
      query:
        description: 'חיפוש חופשי (למשל: "ברצלונה", "ריאל מדריד", "ארסנל", "מכבי חיפה")'
        required: false
        default: 'ברצלונה'
        type: string
      count:
        description: 'כמה תקצירים להוריד'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
          - '10'
      quality:
        description: 'איכות וידאו'
        required: true
        default: '1080'
        type: choice
        options:
          - '1080'
          - '720'
          - '480'
          - 'best'

permissions:
  contents: write

jobs:
  scrape-and-download:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Python & Tools
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade yt-dlp cryptography imageio-ffmpeg curl_cffi
          if command -v ffmpeg >/dev/null 2>&1; then
            FFMPEG_BIN=$(command -v ffmpeg)
          else
            FFMPEG_BIN=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
            chmod +x "$FFMPEG_BIN"
          fi
          echo "FFMPEG_BIN=$FFMPEG_BIN" >> "$GITHUB_ENV"

      - name: Auto-Load YOUTUBE_COOKIES from Secrets
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
        run: |
          python - <<'PY'
          import base64, os, sys

          raw_data = os.environ.get("YOUTUBE_COOKIES", "").strip()
          cookie_key = os.environ.get("COOKIE_KEY", "").strip()

          if not raw_data:
              print("::error::לא נמצא Secret בשם YOUTUBE_COOKIES!")
              sys.exit(1)

          # 1. בדיקה אם העוגיות בטקסט רגיל (Netscape)
          if "youtube.com" in raw_data or "# Netscape" in raw_data:
              with open("cookies.txt", "w", encoding="utf-8") as f:
                  f.write(raw_data)
              print("נטענו עוגיות טקסט ישירות בהצלחה!")
              sys.exit(0)

          # 2. בדיקה אם זה Base64 (טקסט מקודד או מוצפן ב-AES-GCM)
          try:
              blob = base64.b64decode(raw_data)
              try:
                  decoded = blob.decode('utf-8')
                  if "youtube.com" in decoded or "# Netscape" in decoded:
                      with open("cookies.txt", "w", encoding="utf-8") as f:
                          f.write(decoded)
                      print("נטענו עוגיות Base64 בהצלחה!")
                      sys.exit(0)
              except Exception:
                  pass

              # 3. פענוח עם COOKIE_KEY (AES-GCM)
              if cookie_key:
                  from cryptography.hazmat.primitives.ciphers.aead import AESGCM
                  key = bytes.fromhex(cookie_key)
                  iv, ct = blob[:12], blob[12:]
                  data = AESGCM(key).decrypt(iv, ct, None)
                  with open("cookies.txt", "wb") as f:
                      f.write(data)
                  print("פוענחו עוגיות מ-YOUTUBE_COOKIES באמצעות COOKIE_KEY בהצלחה!")
                  sys.exit(0)
          except Exception as e:
              print(f"ניסיון פענוח נכשל: {e}, כותב כטקסט ישיר...")
              with open("cookies.txt", "w", encoding="utf-8") as f:
                  f.write(raw_data)
          PY

      - name: Resolve Video URLs
        env:
          MODE: ${{ inputs.mode }}
          QUERY: ${{ inputs.query }}
          COUNT: ${{ inputs.count }}
        run: |
          python - <<'PY'
          import subprocess, os, sys

          mode = os.environ.get("MODE", "search")
          query = os.environ.get("QUERY", "").strip()
          count = int(os.environ.get("COUNT", "3"))

          urls = []

          def get_flat_urls(target, limit):
              cmd = [
                  "yt-dlp",
                  "--flat-playlist",
                  "--print", "%(id)s",
                  "--playlist-end", str(limit),
              ]
              if os.path.exists("cookies.txt"):
                  cmd.extend(["--cookies", "cookies.txt"])
              cmd.append(target)

              try:
                  res = subprocess.run(cmd, capture_output=True, text=True, check=True)
                  lines = [line.replace('\r', '').replace('\n', '').strip() for line in res.stdout.splitlines() if line.strip()]
                  clean_urls = [f"https://www.youtube.com/watch?v={l}" if not l.startswith("http") else l for l in lines]
                  return clean_urls[:limit]
              except Exception as e:
                  print(f"Error fetching {target}: {e}")
                  return []

          if mode == "search":
              search_term = f"ytsearch{count}:תקציר {query}"
              print(f"מחפש ביוטיוב: {search_term}")
              urls = get_flat_urls(search_term, count)

          elif mode == "latest_sport5":
              urls = get_flat_urls("https://www.youtube.com/@SPORT5_IL/videos", count)

          elif mode == "latest_one":
              urls = get_flat_urls("https://www.youtube.com/@one-1004/videos", count)

          elif mode == "latest_all":
              half = max(1, count // 2)
              urls.extend(get_flat_urls("https://www.youtube.com/@SPORT5_IL/videos", half))
              urls.extend(get_flat_urls("https://www.youtube.com/@one-1004/videos", half))

          elif mode == "direct_url":
              if query:
                  urls = [query]

          with open("targets.txt", "w", encoding="utf-8") as f:
              for u in urls:
                  f.write(u + "\n")

          print(f"נמצאו {len(urls)} סרטונים להורדה.")
          PY

      - name: Download Videos
        env:
          QUALITY: ${{ inputs.quality }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          mkdir -p out

          case "$QUALITY" in
            1080) FMT_ARGS="-f bv*[height<=1080]+ba/b[height<=1080]/bv*+ba/b --merge-output-format mp4" ;;
            720)  FMT_ARGS="-f bv*[height<=720]+ba/b[height<=720]/bv*+ba/b --merge-output-format mp4" ;;
            480)  FMT_ARGS="-f bv*[height<=480]+ba/b[height<=480]/bv*+ba/b --merge-output-format mp4" ;;
            *)    FMT_ARGS="-f bv*+ba/b --merge-output-format mp4" ;;
          esac

          COOKIE_ARGS=""
          if [ -f cookies.txt ]; then
            COOKIE_ARGS="--cookies cookies.txt"
          fi

          PROXY_ARGS=""
          if [ -n "$PROXY_URL" ]; then
            PROXY_ARGS="--proxy $PROXY_URL"
          fi

          run_ytdlp() {
            yt-dlp \
              $FMT_ARGS $COOKIE_ARGS $PROXY_ARGS "$@" \
              --no-playlist --no-progress --newline \
              --retries 5 --fragment-retries 10 \
              --embed-metadata \
              --remote-components ejs:github \
              --ffmpeg-location "$FFMPEG_BIN" \
              -o "out/%(title).100B [%(id)s].%(ext)s" \
              -- "$URL"
          }

          IMP="generic:impersonate"
          ALT="youtube:player_client=default,tv,web_safari,mweb"

          while IFS= read -r URL; do
            URL=$(echo "$URL" | tr -d '\r\n' | xargs)
            [ -z "$URL" ] && continue
            echo "--- מתחיל להוריד: $URL ---"
            if   run_ytdlp --extractor-args "$IMP"; then :
            elif run_ytdlp --extractor-args "$ALT"; then :
            elif run_ytdlp --impersonate chrome; then :
            elif run_ytdlp --extractor-args "$IMP" --extractor-args "$ALT"; then :
            else
              echo "::error::הורדת הסרטון נכשלה: $URL"
            fi
          done < targets.txt
          rm -f cookies.txt

      - name: Always drop cookies
        if: always()
        run: rm -f cookies.txt

      - name: Package to Netfree Safe ZIPs (max 1.8GB)
        run: |
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "::error::לא נמצאו סרטונים שהורדו בהצלחה."
            exit 1
          fi

          mkdir -p pack
          python - <<'PY'
          import os, re, sys, zipfile

          out_dir = "out"
          pack_dir = "pack"
          MAX_SIZE = int(1.8 * 1024 * 1024 * 1024)

          for root, _, fnames in os.walk(out_dir):
              for f in fnames:
                  full = os.path.join(root, f)
                  if os.path.getsize(full) > MAX_SIZE:
                      part = 1
                      chunks = []
                      with open(full, "rb") as src:
                          while True:
                              data = src.read(MAX_SIZE)
                              if not data:
                                  break
                              cpath = f"{full}.{part:03d}"
                              with open(cpath, "wb") as dst:
                                  dst.write(data)
                              chunks.append(cpath)
                              part += 1
                      os.remove(full)
                      bat_path = os.path.splitext(full)[0] + "_JOIN.bat"
                      parts_str = " + ".join([f'"{os.path.basename(c)}"' for c in chunks])
                      with open(bat_path, "w", encoding="utf-8") as bat:
                          bat.write(f'@echo off\ncopy /b {parts_str} "{f}"\necho Joined!\npause\n')

          all_files = []
          for root, _, fnames in os.walk(out_dir):
              for f in fnames:
                  full = os.path.join(root, f)
                  rel = os.path.relpath(full, out_dir)
                  all_files.append((full, rel, os.path.getsize(full)))
          all_files.sort(key=lambda x: x[1])

          base_name = "Sports_Highlights"
          total_sz = sum(f[2] for f in all_files)
          if total_sz <= MAX_SIZE:
              zpath = os.path.join(pack_dir, f"{base_name}.zip")
              with zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_STORED) as zf:
                  for full, rel, _ in all_files:
                      zf.write(full, rel)
          else:
              sub = 1
              cur_sz = 0
              zf = None
              for full, rel, sz in all_files:
                  if zf is None or (cur_sz + sz > MAX_SIZE and cur_sz > 0):
                      if zf:
                          zf.close()
                      zpath = os.path.join(pack_dir, f"{base_name}_part{sub:02d}.zip")
                      zf = zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_STORED)
                      sub += 1
                      cur_sz = 0
                  zf.write(full, rel)
                  cur_sz += sz
              if zf:
                  zf.close()
          PY

      - name: Create Release & Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: sports-${{ github.run_id }}
        run: |
          gh release create "$TAG" --title "משחקי ספורט - $(date +'%d/%m/%Y %H:%M')" --notes "הורדה מוכנה לנטפרי"

          while IFS= read -r -d '' f; do
            esc=$(printf '%s' "$f" | sed 's/[][*?\\]/\\&/g')
            for attempt in 1 2 3 4 5; do
              echo "מעלה את $f..."
              if gh release upload "$TAG" "$esc" --clobber; then
                echo "הועלה בהצלחה!"
                break
              fi
              sleep 5
            done
          done < <(find pack -name "*.zip" -type f -print0)

      - name: Generate Summary Table
        run: |
          echo "## ⚽ רשימת הסרטונים שהורדו בהצלחה" >> "$GITHUB_STEP_SUMMARY"
          echo "| שם הקובץ | גודל |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*; do
            if [ -f "$f" ]; then
              name=$(basename "$f")
              size=$(du -h "$f" | cut -f1)
              echo "| \`$name\` | $size |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
