name: Sports Auto Downloader
run-name: ⚽ ${{ inputs.mode == 'search' && inputs.query || inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'בחר מצב פעולה'
        required: true
        default: 'search'
        type: choice
        options:
          - 'search'         # חיפוש חופשי לפי שם קבוצה/משחק
          - 'latest_all'     # התקצירים האחרונים מכל הערוצים (ספורט 5 + ONE)
          - 'latest_sport5'  # התקצירים האחרונים מערוץ הספורט בלבד
          - 'latest_one'     # התקצירים האחרונים מ-ONE בלבד (ספרדית/איטלקית)
          - 'direct_url'     # הדבקת קישור ישיר (אם יש לך)
      query:
        description: 'חיפוש חופשי (רלוונטי רק למצב search): למשל "ברצלונה", "ארסנל", "מכבי חיפה"'
        required: false
        default: 'ברצלונה'
        type: string
      count:
        description: 'כמה תקצירים/סרטונים להוריד'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
          - '10'
      quality:
        description: 'איכות וידאו'
        required: true
        default: '1080'
        type: choice
        options:
          - '1080'
          - '720'
          - '480'
          - 'best'

permissions:
  contents: write

jobs:
  scrape-and-download:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true

      - name: Set up Environment & Tools
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade yt-dlp imageio-ffmpeg curl_cffi
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Find and Download Matches
        env:
          MODE: ${{ inputs.mode }}
          QUERY: ${{ inputs.query }}
          COUNT: ${{ inputs.count }}
          QUALITY: ${{ inputs.quality }}
        run: |
          mkdir -p out

          case "$QUALITY" in
            1080) FMT="-f bv*[height<=1080]+ba/b[height<=1080]/bv*+ba/b --merge-output-format mp4" ;;
            720)  FMT="-f bv*[height<=720]+ba/b[height<=720]/bv*+ba/b --merge-output-format mp4" ;;
            480)  FMT="-f bv*[height<=480]+ba/b[height<=480]/bv*+ba/b --merge-output-format mp4" ;;
            *)    FMT="-f bv*+ba/b --merge-output-format mp4" ;;
          esac

          python - <<PY
          import subprocess, os, sys

          mode = os.environ.get("MODE", "search")
          query = os.environ.get("QUERY", "").strip()
          count = int(os.environ.get("COUNT", "3"))
          fmt = os.environ.get("FMT", "")

          commands = []

          if mode == "search":
              print(f"=== מחפש ביוטיוב תקצירים עבור: {query} ===")
              # חיפוש ממוקד שמביא את התקצירים הרשמיים בעברית
              search_term = f"ytsearch{count}:תקציר {query}"
              commands.append([
                  "yt-dlp", *fmt.split(),
                  "--no-playlist",
                  "-o", "out/%(title).100B [%(id)s].%(ext)s",
                  "--embed-metadata",
                  search_term
              ])

          elif mode == "latest_sport5":
              print(f"=== מוריד {count} תקצירים אחרונים מספורט 5 ===")
              commands.append([
                  "yt-dlp", *fmt.split(),
                  "--playlist-end", str(count),
                  "-o", "out/%(title).100B [%(id)s].%(ext)s",
                  "--embed-metadata",
                  "https://www.youtube.com/@SPORT5_IL/videos"
              ])

          elif mode == "latest_one":
              print(f"=== מוריד {count} תקצירים אחרונים מ-ONE ===")
              commands.append([
                  "yt-dlp", *fmt.split(),
                  "--playlist-end", str(count),
                  "-o", "out/%(title).100B [%(id)s].%(ext)s",
                  "--embed-metadata",
                  "https://www.youtube.com/@one-1004/videos"
              ])

          elif mode == "latest_all":
              half = max(1, count // 2)
              print(f"=== מוריד {half} מספורט 5 ו-{half} מ-ONE ===")
              commands.append([
                  "yt-dlp", *fmt.split(),
                  "--playlist-end", str(half),
                  "-o", "out/%(title).100B [%(id)s].%(ext)s",
                  "--embed-metadata",
                  "https://www.youtube.com/@SPORT5_IL/videos"
              ])
              commands.append([
                  "yt-dlp", *fmt.split(),
                  "--playlist-end", str(half),
                  "-o", "out/%(title).100B [%(id)s].%(ext)s",
                  "--embed-metadata",
                  "https://www.youtube.com/@one-1004/videos"
              ])

          for cmd in commands:
              try:
                  subprocess.run(cmd, check=True)
              except Exception as e:
                  print(f"שגיאה בהורדה: {e}")
          PY

      - name: Package to Netfree Safe ZIPs (max 1.8GB)
        run: |
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "::error::לא נמצאו סרטונים תואמים להורדה."
            exit 1
          fi

          mkdir -p pack
          python - <<'PY'
          import os, re, sys, zipfile

          out_dir = "out"
          pack_dir = "pack"
          MAX_SIZE = int(1.8 * 1024 * 1024 * 1024)

          # פיצול קבצים מעל 1.8GB אם קיימים
          for root, _, fnames in os.walk(out_dir):
              for f in fnames:
                  full = os.path.join(root, f)
                  if os.path.getsize(full) > MAX_SIZE:
                      part = 1
                      chunks = []
                      with open(full, "rb") as src:
                          while True:
                              data = src.read(MAX_SIZE)
                              if not data:
                                  break
                              cpath = f"{full}.{part:03d}"
                              with open(cpath, "wb") as dst:
                                  dst.write(data)
                              chunks.append(cpath)
                              part += 1
                      os.remove(full)
                      bat_path = os.path.splitext(full)[0] + "_JOIN.bat"
                      parts_str = " + ".join([f'"{os.path.basename(c)}"' for c in chunks])
                      with open(bat_path, "w", encoding="utf-8") as bat:
                          bat.write(f'@echo off\ncopy /b {parts_str} "{f}"\necho Joined!\npause\n')

          all_files = []
          for root, _, fnames in os.walk(out_dir):
              for f in fnames:
                  full = os.path.join(root, f)
                  rel = os.path.relpath(full, out_dir)
                  all_files.append((full, rel, os.path.getsize(full)))
          all_files.sort(key=lambda x: x[1])

          # בניית ZIP
          base_name = "Sports_Highlights"
          total_sz = sum(f[2] for f in all_files)
          if total_sz <= MAX_SIZE:
              zpath = os.path.join(pack_dir, f"{base_name}.zip")
              with zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_STORED) as zf:
                  for full, rel, _ in all_files:
                      zf.write(full, rel)
          else:
              sub = 1
              cur_sz = 0
              zf = None
              for full, rel, sz in all_files:
                  if zf is None or (cur_sz + sz > MAX_SIZE and cur_sz > 0):
                      if zf:
                          zf.close()
                      zpath = os.path.join(pack_dir, f"{base_name}_part{sub:02d}.zip")
                      zf = zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_STORED)
                      sub += 1
                      cur_sz = 0
                  zf.write(full, rel)
                  cur_sz += sz
              if zf:
                  zf.close()
          PY

      - name: Create Release & Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: sports-${{ github.run_id }}
        run: |
          gh release create "$TAG" --title "משחקי ספורט - $(date +'%d/%m/%Y %H:%M')" --notes "הורדה מוכנה לנטפרי"

          while IFS= read -r -d '' f; do
            esc=$(printf '%s' "$f" | sed 's/[][*?\\]/\\&/g')
            for attempt in 1 2 3 4 5; do
              echo "מעלה את $f..."
              if gh release upload "$TAG" "$esc" --clobber; then
                echo "הועלה בהצלחה!"
                break
              fi
              sleep 5
            done
          done < <(find pack -name "*.zip" -type f -print0)

      - name: Generate Summary Table
        run: |
          echo "## ⚽ רשימת הסרטונים שהורדו בהצלחה" >> "$GITHUB_STEP_SUMMARY"
          echo "| שם הקובץ | גודל |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*; do
            if [ -f "$f" ]; then
              name=$(basename "$f")
              size=$(du -h "$f" | cut -f1)
              echo "| \`$name\` | $size |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
