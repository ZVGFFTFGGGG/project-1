name: Content Pipeline
run-name: dl-${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Operation Mode'
        required: true
        default: 'search'
        type: choice
        options:
          - 'search'
          - 'latest'
          - 'direct'
      query:
        description: 'Target query or URL'
        required: false
        default: 'Barcelona'
        type: string
      count:
        description: 'Item count'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '5'
      quality:
        description: 'Quality'
        required: true
        default: '1080'
        type: choice
        options:
          - '1080'
          - '720'
          - '480'
          - 'best'

permissions:
  contents: write

jobs:
  fetch-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free runner space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true

      - name: Set up Python tools
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade yt-dlp imageio-ffmpeg curl_cffi beautifulsoup4 requests
          if command -v ffmpeg >/dev/null 2>&1; then
            FFMPEG_BIN=$(command -v ffmpeg)
          else
            FFMPEG_BIN=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
            chmod +x "$FFMPEG_BIN"
          fi
          echo "FFMPEG_BIN=$FFMPEG_BIN" >> "$GITHUB_ENV"

      - name: Resolve target links
        env:
          MODE: ${{ inputs.mode }}
          QUERY: ${{ inputs.query }}
          COUNT: ${{ inputs.count }}
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, re, os, sys, html
          from bs4 import BeautifulSoup

          mode = os.environ.get("MODE", "search")
          raw_query = os.environ.get("QUERY", "").strip()
          count = int(os.environ.get("COUNT", "3"))

          aliases = {
              "barcelona": ["barcelona", "\u05d1\u05e8\u05e6\u05dc\u05d5\u05e0\u05d4", "\u05d1\u05d0\u05e8\u05e1\u05d4"],
              "real madrid": ["real madrid", "\u05e8\u05d9\u05d0\u05dc \u05de\u05d3\u05e8\u05d9\u05d3", "\u05e8\u05d9\u05d0\u05dc"],
              "real": ["real", "\u05e8\u05d9\u05d0\u05dc"],
              "maccabi": ["maccabi", "\u05de\u05db\u05d1\u05d9"],
              "haifa": ["haifa", "\u05d7\u05d9\u05e4\u05d4"],
              "tel aviv": ["tel aviv", "\u05ea\u05dc \u05d0\u05d1\u05d9\u05d1"],
              "arsenal": ["arsenal", "\u05d0\u05e8\u05e1\u05e0\u05dc"],
              "chelsea": ["chelsea", "\u05e6'\u05dc\u05e1\u05d9", "\u05e6\u05dc\u05e1\u05d9"],
              "liverpool": ["liverpool", "\u05dc\u05d9\u05d1\u05e8\u05e4\u05d5\u05dc"],
              "champions": ["champions", "\u05d0\u05dc\u05d5\u05e4\u05d5\u05ea"],
          }

          q_lower = raw_query.lower()
          search_keys = [q_lower]
          if q_lower in aliases:
              search_keys.extend(aliases[q_lower])

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          targets = []

          def extract_clean_stream(page_url):
              """Extract pure m3u8 stream from article HTML"""
              try:
                  req = urllib.request.Request(page_url, headers=headers)
                  with urllib.request.urlopen(req, timeout=10) as r:
                      page_html = r.read().decode("utf-8", errors="ignore")

                      # Case 1: watch.sport5.co.il?src=
                      match_watch = re.search(r'watch\.sport5\.co\.il\?src=([^"\'<>\s]+)', page_html)
                      if match_watch:
                          raw_src = match_watch.group(1)
                          # Split on delimiters like ___ or &
                          clean_src = raw_src.split("___")[0].split("\\u0026")[0].split("&")[0]
                          clean_src = urllib.parse.unquote(clean_src).strip()
                          if ".m3u8" in clean_src:
                              idx = clean_src.find(".m3u8")
                              return clean_src[:idx + 5]

                      # Case 2: Direct Akamai / Sport5 manifest m3u8
                      match_direct = re.findall(r'(https?://[^\s"\'<>]+\.m3u8[^\s"\'<>]*)', page_html)
                      for stream in match_direct:
                          if "watch.sport5.co.il" in stream and "src=" in stream:
                              stream = stream.split("src=")[-1]
                          stream = stream.split("___")[0].split("\\u0026")[0].split("&")[0]
                          stream = urllib.parse.unquote(stream).strip()
                          if ".m3u8" in stream:
                              idx = stream.find(".m3u8")
                              return stream[:idx + 5]

                      # Case 3: Kaltura entry ID
                      match_kaltura = re.search(r'entry_id["\':\s=]+([a-zA-Z0-9_-]{10,})', page_html)
                      if match_kaltura:
                          eid = match_kaltura.group(1)
                          return f"https://cdnapisec.kaltura.com/p/2568011/sp/256801100/playManifest/entryId/{eid}/format/applehttp/protocol/https/manifest.m3u8"
              except Exception:
                  pass
              return None

          if mode == "direct":
              if raw_query.startswith("http"):
                  stream = extract_clean_stream(raw_query)
                  targets.append((stream or raw_query, "direct_item"))

          else:
              feed_sources = [
                  "https://www.sport5.co.il/sitemap/articles/news-sitemap.xml",
                  "https://www.sport5.co.il/sitemap/articles/sitemap_index.xml"
              ]

              print(f"Query: '{raw_query}', Mode: '{mode}'")
              candidates = []

              for src_url in feed_sources:
                  try:
                      req = urllib.request.Request(src_url, headers=headers)
                      with urllib.request.urlopen(req, timeout=12) as resp:
                          content = resp.read().decode("utf-8", errors="ignore")

                          for block in re.findall(r'<url>(.*?)</url>', content, re.DOTALL):
                              loc_m = re.search(r'<loc>(.*?)</loc>', block)
                              title_m = re.search(r'<news:title>(.*?)</news:title>', block) or re.search(r'<title>(.*?)</title>', block)
                              if loc_m:
                                  loc = html.unescape(loc_m.group(1).strip())
                                  title = html.unescape(title_m.group(1).strip()) if title_m else ""
                                  candidates.append((loc, title))
                  except Exception as e:
                      print(f"Notice ({src_url}): {e}")

              print(f"Collected {len(candidates)} candidates. Filtering active media...")

              for loc, title in candidates:
                  if len(targets) >= count:
                      break

                  t_low = title.lower()
                  l_low = loc.lower()

                  match = False
                  if mode == "search":
                      match = any(k in t_low or k in l_low for k in search_keys)
                  elif mode == "latest":
                      match = True

                  if match:
                      stream_url = extract_clean_stream(loc)
                      if stream_url:
                          safe_title = re.sub(r'[ /\\:*?"<>|]+', '_', title)[:70] or "item"
                          print(f"Resolved valid video stream for: {title[:40]}")
                          targets.append((stream_url, safe_title))

          # Fallback: if search matched 0 items, scan recent candidates for any video
          if not targets and candidates:
              print("No match found, falling back to recent available videos...")
              for loc, title in candidates[:30]:
                  stream_url = extract_clean_stream(loc)
                  if stream_url:
                      safe_title = re.sub(r'[ /\\:*?"<>|]+', '_', title)[:70] or "item"
                      targets.append((stream_url, safe_title))
                      if len(targets) >= count:
                          break

          clean_targets = targets[:count]
          with open("targets.tsv", "w", encoding="utf-8") as f:
              for url, name in clean_targets:
                  f.write(f"{url.strip()}\t{name.strip()}\n")

          print(f"Total resolved target streams: {len(clean_targets)}")
          for u, n in clean_targets:
              print(f"-> {u}")
          PY
          sed -i 's/\r//g' targets.tsv

      - name: Download target items
        env:
          QUALITY: ${{ inputs.quality }}
        run: |
          mkdir -p out

          case "$QUALITY" in
            1080) FMT_ARGS="-f bv*[height<=1080]+ba/b[height<=1080]/bv*+ba/b --merge-output-format mp4" ;;
            720)  FMT_ARGS="-f bv*[height<=720]+ba/b[height<=720]/bv*+ba/b --merge-output-format mp4" ;;
            480)  FMT_ARGS="-f bv*[height<=480]+ba/b[height<=480]/bv*+ba/b --merge-output-format mp4" ;;
            *)    FMT_ARGS="-f bv*+ba/b --merge-output-format mp4" ;;
          esac

          while IFS=$'\t' read -r URL TITLE; do
            [ -z "$URL" ] && continue
            echo "Downloading media stream: $URL"
            yt-dlp \
              $FMT_ARGS \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              --referer "https://www.sport5.co.il/" \
              --no-playlist --no-progress --newline \
              --retries 5 --fragment-retries 10 \
              --embed-metadata \
              --ffmpeg-location "$FFMPEG_BIN" \
              -o "out/${TITLE}.%(ext)s" \
              -- "$URL" || echo "Stream error, continuing..."
          done < targets.tsv

      - name: Package safe archives (max 1.8GB)
        run: |
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "::error::No media files were generated."
            exit 1
          fi

          mkdir -p pack
          python - <<'PY'
          import os, re, sys, zipfile

          out_dir = "out"
          pack_dir = "pack"
          MAX_SIZE = int(1.8 * 1024 * 1024 * 1024)

          for root, _, fnames in os.walk(out_dir):
              for f in fnames:
                  full = os.path.join(root, f)
                  if os.path.getsize(full) > MAX_SIZE:
                      part = 1
                      chunks = []
                      with open(full, "rb") as src:
                          while True:
                              data = src.read(MAX_SIZE)
                              if not data:
                                  break
                              cpath = f"{full}.{part:03d}"
                              with open(cpath, "wb") as dst:
                                  dst.write(data)
                              chunks.append(cpath)
                              part += 1
                      os.remove(full)
                      bat_path = os.path.splitext(full)[0] + "_JOIN.bat"
                      parts_str = " + ".join([f'"{os.path.basename(c)}"' for c in chunks])
                      with open(bat_path, "w", encoding="utf-8") as bat:
                          bat.write(f'@echo off\ncopy /b {parts_str} "{f}"\necho Done!\npause\n')

          all_files = []
          for root, _, fnames in os.walk(out_dir):
              for f in fnames:
                  full = os.path.join(root, f)
                  rel = os.path.relpath(full, out_dir)
                  all_files.append((full, rel, os.path.getsize(full)))
          all_files.sort(key=lambda x: x[1])

          base_name = "collection"
          total_sz = sum(f[2] for f in all_files)
          if total_sz <= MAX_SIZE:
              zpath = os.path.join(pack_dir, f"{base_name}.zip")
              with zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_STORED) as zf:
                  for full, rel, _ in all_files:
                      zf.write(full, rel)
          else:
              sub = 1
              cur_sz = 0
              zf = None
              for full, rel, sz in all_files:
                  if zf is None or (cur_sz + sz > MAX_SIZE and cur_sz > 0):
                      if zf:
                          zf.close()
                      zpath = os.path.join(pack_dir, f"{base_name}_part{sub:02d}.zip")
                      zf = zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_STORED)
                      sub += 1
                      cur_sz = 0
                  zf.write(full, rel)
                  cur_sz += sz
              if zf:
                  zf.close()
          PY

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: pkg-${{ github.run_id }}
        run: |
          gh release create "$TAG" --title "Package - ${{ github.run_id }}" --notes "Automated package - safe to delete"

          while IFS= read -r -d '' f; do
            esc=$(printf '%s' "$f" | sed 's/[][*?\\]/\\&/g')
            for attempt in 1 2 3 4 5; do
              echo "Uploading $f..."
              if gh release upload "$TAG" "$esc" --clobber; then
                echo "Upload successful."
                break
              fi
              sleep 5
            done
          done < <(find pack -name "*.zip" -type f -print0)

      - name: Summary report
        run: |
          echo "## Content Package Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*; do
            if [ -f "$f" ]; then
              name=$(basename "$f")
              size=$(du -h "$f" | cut -f1)
              echo "| \`$name\` | $size |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
