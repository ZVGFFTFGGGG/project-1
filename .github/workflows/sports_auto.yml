name: Sports Auto Downloader
run-name: ⚽ ${{ inputs.query || inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'בחר מקור תקצירים'
        required: true
        default: 'search_israel'
        type: choice
        options:
          - 'search_israel'  # חיפוש חופשי באתרי הספורט הישראליים (ספורט 5 + ONE)
          - 'latest_sport5'  # 5 התקצירים האחרונים מספורט 5
          - 'latest_one'     # 5 התקצירים האחרונים מ-ONE
          - 'direct_url'     # הדבקת קישור ישיר (מכל אתר ספורט)
      query:
        description: 'שם קבוצה (למשל: ברצלונה, ריאל מדריד, מכבי חיפה, ארסנל)'
        required: false
        default: 'ברצלונה'
        type: string
      count:
        description: 'כמות תקצירים'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
      quality:
        description: 'איכות וידאו'
        required: true
        default: '1080'
        type: choice
        options:
          - '1080'
          - '720'
          - '480'
          - 'best'

permissions:
  contents: write

jobs:
  scrape-and-download:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Python & Tools
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade yt-dlp cryptography imageio-ffmpeg curl_cffi beautifulsoup4 requests
          if command -v ffmpeg >/dev/null 2>&1; then
            FFMPEG_BIN=$(command -v ffmpeg)
          else
            FFMPEG_BIN=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
            chmod +x "$FFMPEG_BIN"
          fi
          echo "FFMPEG_BIN=$FFMPEG_BIN" >> "$GITHUB_ENV"

      - name: Auto-Load YOUTUBE_COOKIES from Secrets
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
        run: |
          python - <<'PY'
          import base64, os, sys

          raw_data = os.environ.get("YOUTUBE_COOKIES", "").strip()
          cookie_key = os.environ.get("COOKIE_KEY", "").strip()

          if raw_data:
              if "youtube.com" in raw_data or "# Netscape" in raw_data:
                  with open("cookies.txt", "w", encoding="utf-8") as f:
                      f.write(raw_data)
                  print("נטענו עוגיות Netscape בהצלחה!")
                  sys.exit(0)
              try:
                  blob = base64.b64decode(raw_data)
                  try:
                      decoded = blob.decode('utf-8')
                      if "youtube.com" in decoded or "# Netscape" in decoded:
                          with open("cookies.txt", "w", encoding="utf-8") as f:
                              f.write(decoded)
                          sys.exit(0)
                  except Exception:
                      pass
                  if cookie_key:
                      from cryptography.hazmat.primitives.ciphers.aead import AESGCM
                      key = bytes.fromhex(cookie_key)
                      iv, ct = blob[:12], blob[12:]
                      data = AESGCM(key).decrypt(iv, ct, None)
                      with open("cookies.txt", "wb") as f:
                          f.write(data)
                      sys.exit(0)
              except Exception:
                  with open("cookies.txt", "w", encoding="utf-8") as f:
                      f.write(raw_data)
          PY

      - name: Search and Locate Matches
        env:
          MODE: ${{ inputs.mode }}
          QUERY: ${{ inputs.query }}
          COUNT: ${{ inputs.count }}
        run: |
          python - <<'PY'
          import subprocess, os, sys, urllib.parse, re

          mode = os.environ.get("MODE", "search_israel")
          query = os.environ.get("QUERY", "").strip()
          count = int(os.environ.get("COUNT", "3"))

          urls = []

          # חיפוש ממוקד דרך ערוצי הספורט הרשמיים
          if mode == "search_israel":
              print(f"מחפש תקצירים רשמיים עבור: {query}")
              # חיפוש המפנה ל-Sport5 ו-ONE
              search_cmd = [
                  "yt-dlp",
                  "--flat-playlist",
                  "--print", "%(id)s",
                  "--playlist-end", str(count),
                  f"ytsearch{count}:תקציר {query} ספורט 1 ONE ספורט 5"
              ]
              if os.path.exists("cookies.txt"):
                  search_cmd.extend(["--cookies", "cookies.txt"])

              try:
                  res = subprocess.run(search_cmd, capture_output=True, text=True, check=True)
                  for line in res.stdout.splitlines():
                      vid = line.strip()
                      if vid and re.match(r'^[a-zA-Z0-9_-]{11}$', vid):
                          urls.append(f"https://www.youtube.com/watch?v={vid}")
              except Exception as e:
                  print(f"שגיאת חיפוש: {e}")

          elif mode == "latest_sport5":
              cmd = ["yt-dlp", "--flat-playlist", "--print", "%(id)s", "--playlist-end", str(count), "https://www.youtube.com/@SPORT5_IL/videos"]
              res = subprocess.run(cmd, capture_output=True, text=True)
              for line in res.stdout.splitlines():
                  vid = line.strip()
                  if vid and re.match(r'^[a-zA-Z0-9_-]{11}$', vid):
                      urls.append(f"https://www.youtube.com/watch?v={vid}")

          elif mode == "latest_one":
              cmd = ["yt-dlp", "--flat-playlist", "--print", "%(id)s", "--playlist-end", str(count), "https://www.youtube.com/@one-1004/videos"]
              res = subprocess.run(cmd, capture_output=True, text=True)
              for line in res.stdout.splitlines():
                  vid = line.strip()
                  if vid and re.match(r'^[a-zA-Z0-9_-]{11}$', vid):
                      urls.append(f"https://www.youtube.com/watch?v={vid}")

          elif mode == "direct_url":
              if query:
                  urls = [query.strip()]

          with open("targets.txt", "w", encoding="utf-8") as f:
              for u in urls[:count]:
                  f.write(u + "\n")

          print(f"נמצאו {len(urls[:count])} תקצירים.")
          PY

      - name: Download Videos with Direct Sports Engines
        env:
          QUALITY: ${{ inputs.quality }}
        run: |
          mkdir -p out

          case "$QUALITY" in
            1080) FMT_ARGS="-f bv*[height<=1080]+ba/b[height<=1080]/bv*+ba/b --merge-output-format mp4" ;;
            720)  FMT_ARGS="-f bv*[height<=720]+ba/b[height<=720]/bv*+ba/b --merge-output-format mp4" ;;
            480)  FMT_ARGS="-f bv*[height<=480]+ba/b[height<=480]/bv*+ba/b --merge-output-format mp4" ;;
            *)    FMT_ARGS="-f bv*+ba/b --merge-output-format mp4" ;;
          esac

          COOKIE_ARG=""
          if [ -f cookies.txt ]; then
            COOKIE_ARG="--cookies cookies.txt"
          fi

          run_dl() {
            yt-dlp \
              $FMT_ARGS $COOKIE_ARG "$@" \
              --no-playlist --no-progress --newline \
              --retries 5 --fragment-retries 10 \
              --embed-metadata \
              --remote-components ejs:github \
              --ffmpeg-location "$FFMPEG_BIN" \
              -o "out/%(title).100B [%(id)s].%(ext)s" \
              -- "$TARGET"
          }

          while IFS= read -r TARGET; do
            [ -z "$TARGET" ] && continue
            echo "=== מוריד: $TARGET ==="
            # ניסיון דרך web_embedded ו-tv_downgraded (המעקף שעבד בסקריפט הראשון)
            if   run_dl --extractor-args "youtube:player_client=web_embedded,tv_downgraded"; then :
            elif run_dl --extractor-args "youtube:player_client=android"; then :
            elif run_dl --extractor-args "youtube:player_client=ios"; then :
            elif run_dl --extractor-args "generic:impersonate"; then :
            else
              echo "::error::ההורדה נכשלה עבור $TARGET"
            fi
          done < targets.txt
          rm -f cookies.txt

      - name: Package to Netfree Safe ZIPs (max 1.8GB)
        run: |
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "::error::לא נמצאו סרטונים שהורדו בהצלחה."
            exit 1
          fi

          mkdir -p pack
          python - <<'PY'
          import os, re, sys, zipfile

          out_dir = "out"
          pack_dir = "pack"
          MAX_SIZE = int(1.8 * 1024 * 1024 * 1024)

          for root, _, fnames in os.walk(out_dir):
              for f in fnames:
                  full = os.path.join(root, f)
                  if os.path.getsize(full) > MAX_SIZE:
                      part = 1
                      chunks = []
                      with open(full, "rb") as src:
                          while True:
                              data = src.read(MAX_SIZE)
                              if not data:
                                  break
                              cpath = f"{full}.{part:03d}"
                              with open(cpath, "wb") as dst:
                                  dst.write(data)
                              chunks.append(cpath)
                              part += 1
                      os.remove(full)
                      bat_path = os.path.splitext(full)[0] + "_JOIN.bat"
                      parts_str = " + ".join([f'"{os.path.basename(c)}"' for c in chunks])
                      with open(bat_path, "w", encoding="utf-8") as bat:
                          bat.write(f'@echo off\ncopy /b {parts_str} "{f}"\necho Joined!\npause\n')

          all_files = []
          for root, _, fnames in os.walk(out_dir):
              for f in fnames:
                  full = os.path.join(root, f)
                  rel = os.path.relpath(full, out_dir)
                  all_files.append((full, rel, os.path.getsize(full)))
          all_files.sort(key=lambda x: x[1])

          base_name = "Sports_Highlights"
          total_sz = sum(f[2] for f in all_files)
          if total_sz <= MAX_SIZE:
              zpath = os.path.join(pack_dir, f"{base_name}.zip")
              with zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_STORED) as zf:
                  for full, rel, _ in all_files:
                      zf.write(full, rel)
          else:
              sub = 1
              cur_sz = 0
              zf = None
              for full, rel, sz in all_files:
                  if zf is None or (cur_sz + sz > MAX_SIZE and cur_sz > 0):
                      if zf:
                          zf.close()
                      zpath = os.path.join(pack_dir, f"{base_name}_part{sub:02d}.zip")
                      zf = zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_STORED)
                      sub += 1
                      cur_sz = 0
                  zf.write(full, rel)
                  cur_sz += sz
              if zf:
                  zf.close()
          PY

      - name: Create Release & Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: sports-${{ github.run_id }}
        run: |
          gh release create "$TAG" --title "תקצירי ספורט - $(date +'%d/%m/%Y %H:%M')" --notes "הורדה מוכנה לנטפרי"

          while IFS= read -r -d '' f; do
            esc=$(printf '%s' "$f" | sed 's/[][*?\\]/\\&/g')
            for attempt in 1 2 3 4 5; do
              echo "מעלה את $f..."
              if gh release upload "$TAG" "$esc" --clobber; then
                echo "הועלה בהצלחה!"
                break
              fi
              sleep 5
            done
          done < <(find pack -name "*.zip" -type f -print0)

      - name: Generate Summary Table
        run: |
          echo "## ⚽ רשימת התקצירים שהורדו" >> "$GITHUB_STEP_SUMMARY"
          echo "| שם הקובץ | גודל |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*; do
            if [ -f "$f" ]; then
              name=$(basename "$f")
              size=$(du -h "$f" | cut -f1)
              echo "| \`$name\` | $size |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
