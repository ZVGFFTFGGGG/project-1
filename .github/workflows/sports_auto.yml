name: Content Hub
run-name: hub-${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Target Category'
        required: true
        default: 'latest_feed'
        type: choice
        options:
          - 'latest_feed'        # All latest video highlights across categories
          - 'domestic_league'    # Israeli Premier League (FolderID 127)
          - 'european_league'    # Champions League (FolderID 378)
          - 'secondary_league'   # Liga Leumit (FolderID 3075)
          - 'court_league'       # Basketball / EuroLeague (FolderID 64)
          - 'query_search'       # Custom text query
      query:
        description: 'Query term (used if category is query_search)'
        required: false
        default: 'Barcelona'
        type: string
      scope:
        description: 'Maximum items to collect'
        required: true
        default: '10'
        type: choice
        options:
          - '5'
          - '10'
          - '20'
          - '30'
          - '50'
      action_type:
        description: 'Action'
        required: true
        default: 'download'
        type: choice
        options:
          - 'download'           # Full download and package
          - 'catalog_only'       # List available items without downloading
      quality:
        description: 'Target Quality'
        required: true
        default: '1080'
        type: choice
        options:
          - '1080'
          - '720'
          - '480'
          - 'best'

permissions:
  contents: write

concurrency:
  group: hub-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------- Phase 1: Catalog & Enumerate
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      batches: ${{ steps.catalog.outputs.batches }}
      item_count: ${{ steps.catalog.outputs.count }}
    steps:
      - name: Free runner space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true

      - name: Set up Python tools
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade requests beautifulsoup4

      - name: Build content catalog
        id: catalog
        env:
          CATEGORY: ${{ inputs.category }}
          QUERY: ${{ inputs.query }}
          SCOPE: ${{ inputs.scope }}
          ACTION: ${{ inputs.action_type }}
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, re, os, sys, html, json
          from bs4 import BeautifulSoup

          category = os.environ.get("CATEGORY", "latest_feed")
          raw_query = os.environ.get("QUERY", "").strip()
          max_items = int(os.environ.get("SCOPE", "10"))
          action_type = os.environ.get("ACTION", "download")

          # Folder mappings
          folder_map = {
              "domestic_league": "127",
              "european_league": "378",
              "secondary_league": "3075",
              "court_league": "64"
          }

          aliases = {
              "barcelona": ["barcelona", "\u05d1\u05e8\u05e6\u05dc\u05d5\u05e0\u05d4", "\u05d1\u05d0\u05e8\u05e1\u05d4"],
              "real madrid": ["real madrid", "\u05e8\u05d9\u05d0\u05dc \u05de\u05d3\u05e8\u05d9\u05d3", "\u05e8\u05d9\u05d0\u05dc"],
              "maccabi": ["maccabi", "\u05de\u05db\u05d1\u05d9"],
              "haifa": ["haifa", "\u05d7\u05d9\u05e4\u05d4"],
              "tel aviv": ["tel aviv", "\u05ea\u05dc \u05d0\u05d1\u05d9\u05d1"],
              "arsenal": ["arsenal", "\u05d0\u05e8\u05e1\u05e0\u05dc"],
              "chelsea": ["chelsea", "\u05e6'\u05dc\u05e1\u05d9", "\u05e6\u05dc\u05e1\u05d9"],
              "liverpool": ["liverpool", "\u05dc\u05d9\u05d1\u05e8\u05e4\u05d5\u05dc"]
          }

          q_low = raw_query.lower()
          search_keys = [q_low]
          if q_low in aliases:
              search_keys.extend(aliases[q_low])

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          def clean_title(text):
              t = re.sub(r'<!\[CDATA\[(.*?)\]\]>', r'\1', text, flags=re.DOTALL)
              t = t.replace('<![CDATA[', '').replace(']]>', '')
              t = html.unescape(t).strip()
              t = re.sub(r'[ /\\:*?"<>|]+', '_', t)
              return t.strip('_')[:80] or "item"

          def extract_clean_stream(page_url):
              try:
                  req = urllib.request.Request(page_url, headers=headers)
                  with urllib.request.urlopen(req, timeout=10) as r:
                      page_html = r.read().decode("utf-8", errors="ignore")

                  match_watch = re.search(r'watch\.sport5\.co\.il\?src=([^"\'<>\s]+)', page_html)
                  if match_watch:
                      raw_src = match_watch.group(1)
                      clean = raw_src.split("___")[0].split("\\u0026")[0].split("&")[0]
                      clean = urllib.parse.unquote(clean).strip()
                      if ".m3u8" in clean:
                          return clean[:clean.find(".m3u8") + 5]

                  matches = re.findall(r'(https?://[^\s"\'<>]+\.m3u8[^\s"\'<>]*)', page_html)
                  for stream in matches:
                      if "watch.sport5.co.il" in stream and "src=" in stream:
                          stream = stream.split("src=")[-1]
                      stream = stream.split("___")[0].split("\\u0026")[0].split("&")[0]
                      stream = urllib.parse.unquote(stream).strip()
                      if ".m3u8" in stream:
                          return stream[:stream.find(".m3u8") + 5]
              except Exception:
                  pass
              return None

          candidates = []

          # 1. Fetch from Sitemaps
          sitemap_urls = [
              "https://www.sport5.co.il/sitemap/articles/news-sitemap.xml",
              "https://www.sport5.co.il/sitemap/articles/sitemap_index.xml"
          ]
          for s_url in sitemap_urls:
              try:
                  req = urllib.request.Request(s_url, headers=headers)
                  with urllib.request.urlopen(req, timeout=12) as resp:
                      content = resp.read().decode("utf-8", errors="ignore")
                      for block in re.findall(r'<url>(.*?)</url>', content, re.DOTALL):
                          loc_m = re.search(r'<loc>(.*?)</loc>', block)
                          title_m = re.search(r'<news:title>(.*?)</news:title>', block) or re.search(r'<title>(.*?)</title>', block)
                          if loc_m:
                              loc = html.unescape(loc_m.group(1).strip())
                              title = html.unescape(title_m.group(1).strip()) if title_m else ""
                              candidates.append((loc, title))
              except Exception:
                  pass

          # 2. Category deep page fetch if specific category selected
          if category in folder_map:
              target_fid = folder_map[category]
              for page in range(1, 4):
                  cat_url = f"https://www.sport5.co.il/articles.aspx?FolderID={target_fid}&page={page}"
                  try:
                      req = urllib.request.Request(cat_url, headers=headers)
                      with urllib.request.urlopen(req, timeout=12) as resp:
                          soup = BeautifulSoup(resp.read().decode("utf-8", errors="ignore"), "html.parser")
                          for a in soup.find_all("a", href=True):
                              h = a["href"]
                              if "articles.aspx" in h and "docID=" in h:
                                  full_link = h if h.startswith("http") else f"https://www.sport5.co.il/{h.lstrip('/')}"
                                  full_link = html.unescape(full_link)
                                  t = (a.get_text() or "").strip()
                                  candidates.append((full_link, t))
                  except Exception:
                      pass

          print(f"Total candidate articles gathered: {len(candidates)}")

          # 3. Filter candidates and extract active video streams
          resolved_items = []
          seen_urls = set()

          for loc, title in candidates:
              if len(resolved_items) >= max_items:
                  break
              if loc in seen_urls:
                  continue
              seen_urls.add(loc)

              t_low = title.lower()
              l_low = loc.lower()

              match = False
              if category == "latest_feed":
                  match = True
              elif category in folder_map:
                  match = f"folderid={folder_map[category]}" in l_low or True
              elif category == "query_search":
                  match = any(k in t_low or k in l_low for k in search_keys)

              if match:
                  stream = extract_clean_stream(loc)
                  if stream:
                      safe_name = clean_title(title)
                      resolved_items.append({
                          "stream": stream,
                          "title": safe_name,
                          "page": loc
                      })
                      print(f"[+] Found stream: {safe_name}")

          # 4. Generate GitHub Summary
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"## Content Discovery Report\n\n")
              summary.write(f"- **Category:** `{category}`\n")
              summary.write(f"- **Mode:** `{action_type}`\n")
              summary.write(f"- **Items Found:** `{len(resolved_items)}`\n\n")
              summary.write("| # | Item Title | Direct Stream URL |\n")
              summary.write("| :--- | :--- | :--- |\n")
              for idx, it in enumerate(resolved_items, 1):
                  summary.write(f"| {idx} | `{it['title']}` | [Link]({it['stream']}) |\n")

          # 5. Output batches for parallel download
          if action_type == "catalog_only" or not resolved_items:
              batches = []
          else:
              batch_size = 5
              batches = [
                  {"id": i + 1, "items": resolved_items[k:k + batch_size]}
                  for i, k in enumerate(range(0, len(resolved_items), batch_size))
              ]

          delim = "DELIM_" + os.urandom(8).hex()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"batches<<{delim}\n{json.dumps(batches)}\n{delim}\n")
              out.write(f"count={len(resolved_items)}\n")
          PY

  # ------------------------------------------------------------- Phase 2: Parallel Batch Download
  download-batch:
    needs: enumerate
    if: inputs.action_type == 'download' && fromJson(needs.enumerate.outputs.item_count) > 0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        batch: ${{ fromJson(needs.enumerate.outputs.batches) }}
    name: download-batch ${{ matrix.batch.id }}
    steps:
      - name: Free runner space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true

      - name: Set up Python tools
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade yt-dlp imageio-ffmpeg
          if command -v ffmpeg >/dev/null 2>&1; then
            FFMPEG_BIN=$(command -v ffmpeg)
          else
            FFMPEG_BIN=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
            chmod +x "$FFMPEG_BIN"
          fi
          echo "FFMPEG_BIN=$FFMPEG_BIN" >> "$GITHUB_ENV"

      - name: Download batch items
        env:
          BATCH_DATA: ${{ toJson(matrix.batch.items) }}
          QUALITY: ${{ inputs.quality }}
        run: |
          mkdir -p out

          case "$QUALITY" in
            1080) FMT_ARGS="-f bv*[height<=1080]+ba/b[height<=1080]/bv*+ba/b --merge-output-format mp4" ;;
            720)  FMT_ARGS="-f bv*[height<=720]+ba/b[height<=720]/bv*+ba/b --merge-output-format mp4" ;;
            480)  FMT_ARGS="-f bv*[height<=480]+ba/b[height<=480]/bv*+ba/b --merge-output-format mp4" ;;
            *)    FMT_ARGS="-f bv*+ba/b --merge-output-format mp4" ;;
          esac

          python - <<'PY'
          import json, os, subprocess

          data = json.loads(os.environ["BATCH_DATA"])
          fmt_args = os.environ.get("FMT_ARGS", "").split()
          ffmpeg_bin = os.environ.get("FFMPEG_BIN", "")

          for it in data:
              stream_url = it["stream"]
              title = it["title"]
              out_path = f"out/{title}.%(ext)s"

              print(f"Processing: {title}")
              cmd = [
                  "yt-dlp",
                  *fmt_args,
                  "--user-agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                  "--referer", "https://www.sport5.co.il/",
                  "--no-playlist", "--no-progress", "--newline",
                  "--retries", "5", "--fragment-retries", "10",
                  "--embed-metadata",
                  "--ffmpeg-location", ffmpeg_bin,
                  "-o", out_path,
                  "--", stream_url
              ]
              try:
                  subprocess.run(cmd, check=True)
              except Exception as e:
                  print(f"Error downloading {title}: {e}")
          PY

      - name: Package batch to safe archives (max 1.8GB)
        run: |
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "No media files created in this batch."
            exit 0
          fi

          mkdir -p pack
          python - <<'PY'
          import os, re, sys, zipfile

          out_dir = "out"
          pack_dir = "pack"
          batch_id = "${{ matrix.batch.id }}"
          MAX_SIZE = int(1.8 * 1024 * 1024 * 1024)

          # Auto split any file exceeding 1.8GB
          for root, _, fnames in os.walk(out_dir):
              for f in fnames:
                  full = os.path.join(root, f)
                  if os.path.getsize(full) > MAX_SIZE:
                      part = 1
                      chunks = []
                      with open(full, "rb") as src:
                          while True:
                              data = src.read(MAX_SIZE)
                              if not data:
                                  break
                              cpath = f"{full}.{part:03d}"
                              with open(cpath, "wb") as dst:
                                  dst.write(data)
                              chunks.append(cpath)
                              part += 1
                      os.remove(full)
                      bat_path = os.path.splitext(full)[0] + "_JOIN.bat"
                      parts_str = " + ".join([f'"{os.path.basename(c)}"' for c in chunks])
                      with open(bat_path, "w", encoding="utf-8") as bat:
                          bat.write(f'@echo off\ncopy /b {parts_str} "{f}"\necho Done!\npause\n')

          all_files = []
          for root, _, fnames in os.walk(out_dir):
              for f in fnames:
                  full = os.path.join(root, f)
                  rel = os.path.relpath(full, out_dir)
                  all_files.append((full, rel, os.path.getsize(full)))
          all_files.sort(key=lambda x: x[1])

          base_name = f"bundle_b{int(batch_id):02d}"
          total_sz = sum(f[2] for f in all_files)

          if total_sz <= MAX_SIZE:
              zpath = os.path.join(pack_dir, f"{base_name}.zip")
              with zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_STORED) as zf:
                  for full, rel, _ in all_files:
                      zf.write(full, rel)
          else:
              sub = 1
              cur_sz = 0
              zf = None
              for full, rel, sz in all_files:
                  if zf is None or (cur_sz + sz > MAX_SIZE and cur_sz > 0):
                      if zf:
                          zf.close()
                      zpath = os.path.join(pack_dir, f"{base_name}_part{sub:02d}.zip")
                      zf = zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_STORED)
                      sub += 1
                      cur_sz = 0
                  zf.write(full, rel)
                  cur_sz += sz
              if zf:
                  zf.close()
          PY

      - name: Upload batch packages to Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: hub-${{ github.run_id }}
        run: |
          gh release create "$TAG" --title "Hub - ${{ github.run_id }}" --notes "Automated package" 2>/dev/null || true

          while IFS= read -r -d '' f; do
            esc=$(printf '%s' "$f" | sed 's/[][*?\\]/\\&/g')
            for attempt in 1 2 3 4 5; do
              echo "Uploading $f..."
              if gh release upload "$TAG" "$esc" --clobber; then
                echo "Upload successful."
                break
              fi
              sleep 5
            done
          done < <(find pack -name "*.zip" -type f -print0)
