name: Content Pipeline
run-name: dl-${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Operation Mode'
        required: true
        default: 'search'
        type: choice
        options:
          - 'search'
          - 'latest'
          - 'direct'
      query:
        description: 'Target query or URL'
        required: false
        default: 'Barcelona'
        type: string
      count:
        description: 'Item count'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '5'
      quality:
        description: 'Quality'
        required: true
        default: '1080'
        type: choice
        options:
          - '1080'
          - '720'
          - '480'
          - 'best'

permissions:
  contents: write

jobs:
  fetch-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free runner space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true

      - name: Set up Python tools
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade yt-dlp imageio-ffmpeg curl_cffi beautifulsoup4 requests
          if command -v ffmpeg >/dev/null 2>&1; then
            FFMPEG_BIN=$(command -v ffmpeg)
          else
            FFMPEG_BIN=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
            chmod +x "$FFMPEG_BIN"
          fi
          echo "FFMPEG_BIN=$FFMPEG_BIN" >> "$GITHUB_ENV"

      - name: Resolve target links
        env:
          MODE: ${{ inputs.mode }}
          QUERY: ${{ inputs.query }}
          COUNT: ${{ inputs.count }}
        run: |
          python - <<'PY'
          import urllib.request, re, os, sys, html

          mode = os.environ.get("MODE", "search")
          raw_query = os.environ.get("QUERY", "").strip()
          count = int(os.environ.get("COUNT", "3"))

          aliases = {
              "barcelona": ["barcelona", "\u05d1\u05e8\u05e6\u05dc\u05d5\u05e0\u05d4", "\u05d1\u05d0\u05e8\u05e1\u05d4"],
              "real madrid": ["real madrid", "\u05e8\u05d9\u05d0\u05dc \u05de\u05d3\u05e8\u05d9\u05d3", "\u05e8\u05d9\u05d0\u05dc"],
              "real": ["real", "\u05e8\u05d9\u05d0\u05dc"],
              "maccabi": ["maccabi", "\u05de\u05db\u05d1\u05d9"],
              "haifa": ["haifa", "\u05d7\u05d9\u05e4\u05d4"],
              "tel aviv": ["tel aviv", "\u05ea\u05dc \u05d0\u05d1\u05d9\u05d1"],
              "arsenal": ["arsenal", "\u05d0\u05e8\u05e1\u05e0\u05dc"],
              "chelsea": ["chelsea", "\u05e6'\u05dc\u05e1\u05d9", "\u05e6\u05dc\u05e1\u05d9"],
              "liverpool": ["liverpool", "\u05dc\u05d9\u05d1\u05e8\u05e4\u05d5\u05dc"],
              "champions": ["champions", "\u05d0\u05dc\u05d5\u05e4\u05d5\u05ea"],
          }

          q_lower = raw_query.lower()
          search_keys = [q_lower]
          if q_lower in aliases:
              search_keys.extend(aliases[q_lower])

          targets = []

          if mode == "direct":
              if raw_query.startswith("http"):
                  targets.append(raw_query)

          else:
              feed_sources = [
                  "https://www.sport5.co.il/sitemap/articles/news-sitemap.xml",
                  "https://www.sport5.co.il/sitemap/games/news-sitemap.xml"
              ]

              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko)"
              }

              print(f"Query: '{raw_query}', Keys: {search_keys}, Mode: '{mode}'")
              candidate_pool = []

              for src_url in feed_sources:
                  try:
                      req = urllib.request.Request(src_url, headers=headers)
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          content = resp.read().decode("utf-8", errors="ignore")

                          for block in re.findall(r'<url>(.*?)</url>', content, re.DOTALL):
                              loc_m = re.search(r'<loc>(.*?)</loc>', block)
                              title_m = re.search(r'<news:title>(.*?)</news:title>', block) or re.search(r'<title>(.*?)</title>', block)
                              if loc_m:
                                  # Unescape HTML entities like &amp; to &
                                  loc = html.unescape(loc_m.group(1).strip())
                                  title = html.unescape(title_m.group(1).strip()) if title_m else ""
                                  candidate_pool.append((loc, title))

                  except Exception as e:
                      print(f"Source note ({src_url}): {e}")

              print(f"Parsed {len(candidate_pool)} total candidates from active sitemaps.")

              media_hints = ["\u05ea\u05e7\u05e6\u05d9\u05e8", "\u05e6\u05e4\u05d5", "\u05d5\u05d9\u05d3\u05d0\u05d5"]

              for loc, title in candidate_pool:
                  if loc in targets:
                      continue
                  t_low = title.lower()
                  l_low = loc.lower()

                  if mode == "search":
                      has_query = any(k in t_low or k in l_low for k in search_keys)
                      if has_query:
                          targets.append(loc)
                          if len(targets) >= count * 5: # Pool enough candidates
                              break

                  elif mode == "latest":
                      has_media = any(hint in t_low for hint in media_hints)
                      if has_media:
                          targets.append(loc)
                          if len(targets) >= count * 5:
                              break

              if not targets and candidate_pool:
                  for loc, _ in candidate_pool:
                      if loc not in targets:
                          targets.append(loc)
                          if len(targets) >= count * 3:
                              break

          with open("targets.txt", "w", encoding="utf-8") as f:
              for u in targets:
                  f.write(u.strip() + "\n")

          print(f"Total resolved targets: {len(targets)}")
          for u in targets[:10]:
              print(f"-> {u}")
          PY
          sed -i 's/\r//g' targets.txt

      - name: Download target items
        env:
          QUALITY: ${{ inputs.quality }}
          COUNT: ${{ inputs.count }}
        run: |
          mkdir -p out

          case "$QUALITY" in
            1080) FMT_ARGS="-f bv*[height<=1080]+ba/b[height<=1080]/bv*+ba/b --merge-output-format mp4" ;;
            720)  FMT_ARGS="-f bv*[height<=720]+ba/b[height<=720]/bv*+ba/b --merge-output-format mp4" ;;
            480)  FMT_ARGS="-f bv*[height<=480]+ba/b[height<=480]/bv*+ba/b --merge-output-format mp4" ;;
            *)    FMT_ARGS="-f bv*+ba/b --merge-output-format mp4" ;;
          esac

          max_items=${COUNT:-3}
          downloaded=0

          while IFS= read -r URL; do
            URL=$(echo "$URL" | tr -d '\r\n' | xargs)
            [ -z "$URL" ] && continue
            echo "Processing item: $URL"
            if yt-dlp \
              $FMT_ARGS \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              --referer "https://www.sport5.co.il/" \
              --no-playlist --no-progress --newline \
              --retries 3 --fragment-retries 5 \
              --embed-metadata \
              --ffmpeg-location "$FFMPEG_BIN" \
              -o "out/%(title).100B [%(id)s].%(ext)s" \
              -- "$URL"; then
              downloaded=$((downloaded + 1))
              echo "Successfully downloaded $downloaded / $max_items"
              if [ "$downloaded" -ge "$max_items" ]; then
                echo "Target count reached ($downloaded items)."
                break
              fi
            else
              echo "Item has no video or skipped, trying next..."
            fi
          done < targets.txt

      - name: Package safe archives (max 1.8GB)
        run: |
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "::error::No media files were generated."
            exit 1
          fi

          mkdir -p pack
          python - <<'PY'
          import os, re, sys, zipfile

          out_dir = "out"
          pack_dir = "pack"
          MAX_SIZE = int(1.8 * 1024 * 1024 * 1024)

          for root, _, fnames in os.walk(out_dir):
              for f in fnames:
                  full = os.path.join(root, f)
                  if os.path.getsize(full) > MAX_SIZE:
                      part = 1
                      chunks = []
                      with open(full, "rb") as src:
                          while True:
                              data = src.read(MAX_SIZE)
                              if not data:
                                  break
                              cpath = f"{full}.{part:03d}"
                              with open(cpath, "wb") as dst:
                                  dst.write(data)
                              chunks.append(cpath)
                              part += 1
                      os.remove(full)
                      bat_path = os.path.splitext(full)[0] + "_JOIN.bat"
                      parts_str = " + ".join([f'"{os.path.basename(c)}"' for c in chunks])
                      with open(bat_path, "w", encoding="utf-8") as bat:
                          bat.write(f'@echo off\ncopy /b {parts_str} "{f}"\necho Done!\npause\n')

          all_files = []
          for root, _, fnames in os.walk(out_dir):
              for f in fnames:
                  full = os.path.join(root, f)
                  rel = os.path.relpath(full, out_dir)
                  all_files.append((full, rel, os.path.getsize(full)))
          all_files.sort(key=lambda x: x[1])

          base_name = "collection"
          total_sz = sum(f[2] for f in all_files)
          if total_sz <= MAX_SIZE:
              zpath = os.path.join(pack_dir, f"{base_name}.zip")
              with zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_STORED) as zf:
                  for full, rel, _ in all_files:
                      zf.write(full, rel)
          else:
              sub = 1
              cur_sz = 0
              zf = None
              for full, rel, sz in all_files:
                  if zf is None or (cur_sz + sz > MAX_SIZE and cur_sz > 0):
                      if zf:
                          zf.close()
                      zpath = os.path.join(pack_dir, f"{base_name}_part{sub:02d}.zip")
                      zf = zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_STORED)
                      sub += 1
                      cur_sz = 0
                  zf.write(full, rel)
                  cur_sz += sz
              if zf:
                  zf.close()
          PY

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: pkg-${{ github.run_id }}
        run: |
          gh release create "$TAG" --title "Package - ${{ github.run_id }}" --notes "Automated package - safe to delete"

          while IFS= read -r -d '' f; do
            esc=$(printf '%s' "$f" | sed 's/[][*?\\]/\\&/g')
            for attempt in 1 2 3 4 5; do
              echo "Uploading $f..."
              if gh release upload "$TAG" "$esc" --clobber; then
                echo "Upload successful."
                break
              fi
              sleep 5
            done
          done < <(find pack -name "*.zip" -type f -print0)

      - name: Summary report
        run: |
          echo "## Content Package Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*; do
            if [ -f "$f" ]; then
              name=$(basename "$f")
              size=$(du -h "$f" | cut -f1)
              echo "| \`$name\` | $size |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
